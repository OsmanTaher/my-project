<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Player Project</title>
    <link rel="shortcut icon" href="./logo.ico" type="image/x-icon" />
    <style>
      :root {
        --bg-dark: #0f1621;
        --bg-dark-alt: #192231;
        --text-dark: #ffffff;
        --card-dark: #1a2230;
        --hover-dark: #223047;
        --shadow-dark: #2a3a55;
        --primary-blue: #2563eb;
        --primary-blue-hover: #1d4ed8;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: var(--bg-dark);
        color: var(--text-dark);
        display: flex;
        justify-content: center;
        transition: background 0.3s, color 0.3s;
        overflow-x: hidden;
      }

      .container {
        max-width: 1234px;
        padding: 20px;
        width: 100%;
      }

      /* حاوية الفيديو المخصصة */
      .video-wrapper {
        position: relative;
        text-align: center;
        background: #000;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }

      video {
        width: 100%;
        display: block;
        cursor: pointer;
      }

      /* شريط التحكم الفاخر الجديد */
      .custom-controls {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: linear-gradient(to top, rgba(15, 22, 33, 0.95), rgba(15, 22, 33, 0.7), transparent);
        padding: 20px 15px 10px 15px;
        opacity: 0;
        transition: opacity 0.3s ease;
        z-index: 10;
      }

      .video-wrapper:hover .custom-controls,
      .video-wrapper:focus-within .custom-controls {
        opacity: 1;
      }

      /* شريط التقدم الفاخر */
      .timeline-container {
        position: relative;
        height: 6px;
        background: rgba(255, 255, 255, 0.2);
        cursor: pointer;
        border-radius: 4px;
        margin-bottom: 12px;
        transition: height 0.1s ease;
      }

      .timeline-container:hover {
        height: 8px;
      }

      .timeline-progress {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        background: var(--primary-blue);
        border-radius: 4px;
        width: 0%;
      }

      .timeline-handle {
        position: absolute;
        top: 50%;
        transform: translate(-50%, -50%) scale(0);
        width: 14px;
        height: 14px;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        transition: transform 0.1s ease;
      }

      .timeline-container:hover .timeline-handle {
        transform: translate(-50%, -50%) scale(1);
      }

      .controls-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .controls-left, .controls-right {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .ctrl-btn {
        background: none;
        border: none;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
        transition: color 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .ctrl-btn:hover {
        color: var(--primary-blue);
      }

      .time-display {
        font-size: 13px;
        font-weight: 600;
        color: #e0e0e0;
      }

      .volume-box {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .volume-slider {
        -webkit-appearance: none;
        width: 70px;
        height: 4px;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 2px;
        outline: none;
      }

      .volume-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 12px;
        height: 12px;
        background: #fff;
        border-radius: 50%;
        cursor: pointer;
      }

      /* تأثير الـ Popover الخاص بالقفز الحركي (+5 / -5) على طريقة يوتيوب */
      .popover-indicator {
        position: absolute;
        top: 50%;
        transform: translate(-50%, -50%);
        background: rgba(37, 99, 235, 0.3);
        border: 2px solid var(--primary-blue);
        backdrop-filter: blur(4px);
        width: 80px;
        height: 80px;
        border-radius: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        z-index: 15;
      }

      .popover-indicator.left-side { left: 25%; }
      .popover-indicator.right-side { left: 75%; }

      .popover-indicator span {
        font-size: 16px;
        font-weight: bold;
        color: #fff;
      }

      @keyframes popUrgent {
        0% { transform: translate(-50%, -50%) scale(0.6); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translate(-50%, -50%) scale(1.1); opacity: 0; }
      }

      .popover-indicator.animate {
        animation: popUrgent 0.5s ease-out forwards;
      }

      /* تعديل بقية عناصر واجهة المستخدم */
      .toggle-btn {
        margin: 15px 0;
        padding: 10px 20px;
        background: var(--bg-dark-alt);
        border: none;
        color: var(--text-dark);
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s all;
        font-weight: 600;
      }

      .toggle-btn:hover {
        background: var(--hover-dark);
      }

      .timestamps {
        background: var(--bg-dark-alt);
        border-radius: 8px;
        padding: 15px;
        max-height: 600px;
        overflow-y: auto;
      }

      .timestamps ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      textarea {
        margin-top: 10px;
        border-radius: 10px;
        background-color: transparent;
        color: var(--text-dark);
        border: 1px solid var(--text-dark);
        outline: none;
        width: 100%;
        padding: 15px;
        height: 150px;
        font-size: 20px;
        resize: vertical;
      }

      #videoNameInput {
        margin-top: 15px;
        border-radius: 10px;
        background-color: transparent;
        color: var(--text-dark);
        border: 1px solid var(--text-dark);
        outline: none;
        width: 100%;
        padding: 12px 15px;
        font-size: 16px;
        transition: 0.3s all;
      }

      #videoNameInput:focus {
        border-color: var(--primary-blue);
      }

      .buttons-group {
        display: flex;
        gap: 10px;
        margin-top: 12px;
      }

      .folder-btn {
        padding: 11px 15px;
        background: #223047;
        border: 1px solid var(--shadow-dark);
        color: var(--text-dark);
        font-size: 15px;
        border-radius: 8px;
        cursor: pointer;
        flex: 1;
        font-weight: 600;
        transition: 0.3s all;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
      }

      .folder-btn:hover {
        background: var(--primary-blue);
        color: #fff;
        border-color: var(--primary-blue);
      }

      .clear-btn {
        padding: 11px 15px;
        background: #311919;
        border: 1px solid #552a2a;
        color: var(--text-dark);
        font-size: 15px;
        border-radius: 8px;
        cursor: pointer;
        flex: 1;
        font-weight: 600;
        transition: 0.3s all;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
      }

      .clear-btn:hover {
        background: #b91d1d;
        color: #fff;
        border-color: #b91d1d;
      }

      .files-dropdown {
        margin-top: 10px;
        background: #0f1621;
        border: 1px solid var(--shadow-dark);
        border-radius: 8px;
        max-height: 220px;
        overflow-y: auto;
        padding: 5px 0;
        list-style: none;
      }

      .files-dropdown li {
        padding: 10px 15px;
        cursor: pointer;
        font-size: 13px;
        border-bottom: 1px solid var(--shadow-dark);
        transition: 0.2s all;
        text-align: right;
        color: #e0e0e0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .files-dropdown li:hover {
        background: var(--hover-dark);
        color: var(--primary-blue);
        padding-right: 22px;
      }

      .confetti-piece {
        position: fixed;
        top: -50px;
        width: 35px;
        height: 35px;
        background-image: url('confetti.png');
        background-size: contain;
        background-repeat: no-repeat;
        z-index: 9999;
        pointer-events: none;
        animation: fall linear forwards;
      }

      @keyframes fall {
        0% { transform: translateY(0) rotate(0deg); opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="video-wrapper" id="videoWrapper">
        <video id="video" poster="Dream.png">
          <source src="" type="video/mp4" />
          Your browser does not support HTML5 video.
        </video>

        <div id="popLeft" class="popover-indicator left-side"><span>-5s</span></div>
        <div id="popRight" class="popover-indicator right-side"><span>+5s</span></div>

        <div class="custom-controls" id="customControls">
          <div class="timeline-container" id="timelineContainer">
            <div class="timeline-progress" id="timelineProgress"></div>
            <div class="timeline-handle" id="timelineHandle"></div>
          </div>
          <div class="controls-row">
            <div class="controls-left">
              <button class="ctrl-btn" id="playBtn">▶</button>
              <div class="time-display" id="timeDisplay">00:00 / 00:00</div>
            </div>
            <div class="controls-right">
              <div class="volume-box">
                <button class="ctrl-btn" id="muteBtn">🔊</button>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1" />
              </div>
              <button class="ctrl-btn" id="fullscreenBtn">⬜</button>
            </div>
          </div>
        </div>
      </div>

      <button id="toggleTimestamps" class="toggle-btn">⏱ Show/Hide Timestamps</button>

      <div id="timestamps" class="timestamps">
        <ul>
          <textarea id="notes" dir="rtl" placeholder="اكتب ملاحظاتك هنا... واستخدم الاختصار Alt + T لإدراج التوقيت الحالي"></textarea>

          <input
            type="text"
            id="videoNameInput"
            dir="rtl"
            placeholder="أدخل اسم ملف الفيديو هنا واضغط Enter..."
          />

          <input type="file" id="folderPicker" webkitdirectory directory multiple style="display: none;" />
          <input type="file" id="videoFilePicker" accept="video/mp4,video/*" style="display: none;" />
          
          <div class="buttons-group">
            <button id="viewFolderBtn" class="folder-btn">📁 عرض المجلد</button>
            <button id="chooseVideoBtn" class="folder-btn">🎥 اختيار فيديو</button>
            <button id="clearStorageBtn" class="clear-btn">🗑️ مسح التخزين</button>
          </div>
          
          <ul id="folderFilesList" class="files-dropdown" style="display: none;"></ul>
        </ul>
      </div>
    </div>

    <script>
      const video = document.getElementById("video");
      const videoWrapper = document.getElementById("videoWrapper");
      const timestamps = document.getElementById("timestamps");
      const toggleBtn = document.getElementById("toggleTimestamps");
      const notesBox = document.getElementById("notes");

      const videoNameInput = document.getElementById("videoNameInput");
      const videoSource = video.querySelector("source");

      const viewFolderBtn = document.getElementById("viewFolderBtn");
      const clearStorageBtn = document.getElementById("clearStorageBtn");
      const folderPicker = document.getElementById("folderPicker");
      const folderFilesList = document.getElementById("folderFilesList");

      const chooseVideoBtn = document.getElementById("chooseVideoBtn");
      const videoFilePicker = document.getElementById("videoFilePicker");

      // عناصر شريط التحكم الجديد
      const playBtn = document.getElementById("playBtn");
      const timeDisplay = document.getElementById("timeDisplay");
      const muteBtn = document.getElementById("muteBtn");
      const volumeSlider = document.getElementById("volumeSlider");
      const fullscreenBtn = document.getElementById("fullscreenBtn");
      const timelineContainer = document.getElementById("timelineContainer");
      const timelineProgress = document.getElementById("timelineProgress");
      const timelineHandle = document.getElementById("timelineHandle");

      const popLeft = document.getElementById("popLeft");
      const popRight = document.getElementById("popRight");

      let loadedVideoFiles = []; 

      function formatTime(seconds) {
        if (isNaN(seconds)) return "00:00";
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `[${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}] `;
      }

      function formatDisplayTime(secs) {
        if (isNaN(secs)) return "00:00";
        const m = Math.floor(secs / 60);
        const s = Math.floor(secs % 60);
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      }

      // إدراج التوقيت الحالي في النوتس
      function insertTimestamp() {
        const timestampText = formatTime(video.currentTime);
        const startPos = notesBox.selectionStart;
        const endPos = notesBox.selectionEnd;
        const currentText = notesBox.value;

        notesBox.value = currentText.substring(0, startPos) + timestampText + currentText.substring(endPos);
        notesBox.selectionStart = notesBox.selectionEnd = startPos + timestampText.length;
        notesBox.focus();
        localStorage.setItem("myNotes", notesBox.value);
      }

      // تحديث شريط التقدم الزمني المخصص والوقت المكتوب
      function updateProgress() {
        if (video.duration) {
          const percentage = (video.currentTime / video.duration) * 100;
          timelineProgress.style.width = `${percentage}%`;
          timelineHandle.style.left = `${percentage}%`;
          timeDisplay.textContent = `${formatDisplayTime(video.currentTime)} / ${formatDisplayTime(video.duration)}`;
        }
      }
      video.addEventListener("timeupdate", updateProgress);
      video.addEventListener("timeupdate", () => {
        localStorage.setItem("lastVideoTime", video.currentTime);
      });

      // التحكم بالتقديم والتأخير عبر سحب أو النقر على خط الـ Timeline
      function setTimelinePosition(e) {
        const rect = timelineContainer.getBoundingClientRect();
        const pos = (e.clientX - rect.left) / rect.width;
        video.currentTime = pos * video.duration;
      }

      let isDraggingTimeline = false;
      timelineContainer.addEventListener("mousedown", (e) => {
        isDraggingTimeline = true;
        setTimelinePosition(e);
      });
      document.addEventListener("mousemove", (e) => {
        if (isDraggingTimeline) setTimelinePosition(e);
      });
      document.addEventListener("mouseup", () => {
        isDraggingTimeline = false;
      });

      // تشغيل وإيقاف الفيديو مخصص
      function togglePlay() {
        if (video.paused) {
          video.play().catch(err => console.log(err));
          playBtn.textContent = "⏸";
        } else {
          video.pause();
          playBtn.textContent = "▶";
        }
      }
      playBtn.addEventListener("click", togglePlay);
      video.addEventListener("click", togglePlay);

      video.addEventListener("play", () => playBtn.textContent = "⏸");
      video.addEventListener("pause", () => playBtn.textContent = "▶");

      // التحكم في الصوت والميوت
      volumeSlider.addEventListener("input", (e) => {
        video.volume = e.target.value;
        video.muted = (video.volume === 0);
        muteBtn.textContent = video.muted ? "🔇" : "🔊";
      });

      muteBtn.addEventListener("click", () => {
        video.muted = !video.muted;
        muteBtn.textContent = video.muted ? "🔇" : "🔊";
        volumeSlider.value = video.muted ? 0 : video.volume;
      });

      // ملء الشاشة المخصص
      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          videoWrapper.requestFullscreen().catch(err => console.log(err));
          fullscreenBtn.textContent = "🎵";
        } else {
          document.exitFullscreen();
          fullscreenBtn.textContent = "⬜";
        }
      }
      fullscreenBtn.addEventListener("click", toggleFullscreen);

      // تشغيل تأثير الـ Popover المرئي عند التقديم والتأخير
      function triggerPopover(isRight) {
        const el = isRight ? popRight : popLeft;
        el.classList.remove("animate");
        void el.offsetWidth; 
        el.classList.add("animate");
      }

      // هندسة استدعاء وعرض قائمة الفيديوهات
      function renderFilesList(filesArray) {
        folderFilesList.innerHTML = "";
        const currentFolder = localStorage.getItem("selectedFolderName") || "File";
        
        filesArray.forEach((fileName) => {
          const li = document.createElement("li");
          li.textContent = `🎥 ${fileName}`;
          li.title = fileName;
          
          li.addEventListener("click", () => {
            loadSelectedVideo(fileName, currentFolder);
          });
          folderFilesList.appendChild(li);
        });
      }

      function loadSelectedVideo(fileName, folderName) {
        videoNameInput.value = fileName;
        localStorage.setItem("videoName", fileName);
        localStorage.setItem("isStandaloneVideo", "false");

        videoSource.src = `../${folderName}/${fileName}`;
        video.src = `../${folderName}/${fileName}`;
        video.load();
        video.play().catch((err) => console.log("بث الفيديو..."));
        videoNameInput.blur();
      }

      viewFolderBtn.addEventListener("click", () => {
        if (loadedVideoFiles.length === 0) {
          folderPicker.click(); 
        } else {
          folderFilesList.style.display =
            folderFilesList.style.display === "none" ? "block" : "none";
        }
      });

      folderPicker.addEventListener("change", (e) => {
        const files = e.target.files;
        if (files.length === 0) return;

        const folderName = files[0].webkitRelativePath.split('/')[0];
        localStorage.setItem("selectedFolderName", folderName);

        loadedVideoFiles = [];
        for (let file of files) {
          if (file.name.toLowerCase().endsWith(".mp4")) {
            loadedVideoFiles.push(file.name);
          }
        }

        loadedVideoFiles.sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));

        if (loadedVideoFiles.length > 0) {
          localStorage.setItem("cachedFolderFiles", JSON.stringify(loadedVideoFiles));
          renderFilesList(loadedVideoFiles);
          folderFilesList.style.display = "block";
          loadSelectedVideo(loadedVideoFiles[0], folderName);
        } else {
          alert("لم يتم العثور على ملفات mp4 داخل المجلد المحدد!");
        }
      });

      // زر اختيار فيديو منفرد
      chooseVideoBtn.addEventListener("click", () => {
        videoFilePicker.click();
      });

      videoFilePicker.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;

        videoNameInput.value = file.name;
        localStorage.setItem("videoName", file.name);
        localStorage.setItem("isStandaloneVideo", "true");

        const fileURL = URL.createObjectURL(file);
        videoSource.src = fileURL;
        video.src = fileURL;
        video.load();
        video.play().catch((err) => console.log("خطأ في تشغيل الفيديو المختار:", err));
      });

      clearStorageBtn.addEventListener("click", () => {
        if (confirm("هل أنت متأكد من مسح جميع البيانات الكاش وإعادة تهيئة المشغل؟")) {
          localStorage.clear();
          location.reload();
        }
      });

      // تهيئة ومزامنة البيانات عند الإقلاع الفوري وإعادة التحميل الذكي
      window.addEventListener("load", () => {
        const cachedFiles = localStorage.getItem("cachedFolderFiles");
        if (cachedFiles) {
          loadedVideoFiles = JSON.parse(cachedFiles);
          renderFilesList(loadedVideoFiles);
        }

        const currentFolder = localStorage.getItem("selectedFolderName") || "File";
        let savedVideoName = localStorage.getItem("videoName") || "";
        const isStandalone = localStorage.getItem("isStandaloneVideo") === "true";
        
        if (savedVideoName) {
          if (!savedVideoName.toLowerCase().endsWith(".mp4")) {
            savedVideoName += ".mp4";
          }
          videoNameInput.value = savedVideoName;
          
          // حل ذكي: إذا كان الملف مختاراً مسبقاً عبر منقي الملفات المنفرد ويوجد نسخة منه في مجلد الكاش، يتم حله فوراً وتلقائياً
          if (isStandalone && loadedVideoFiles.includes(savedVideoName)) {
            videoSource.src = `../${currentFolder}/${savedVideoName}`;
            video.src = `../${currentFolder}/${savedVideoName}`;
            video.load();
          } else if (!isStandalone) {
            videoSource.src = `../${currentFolder}/${savedVideoName}`;
            video.src = `../${currentFolder}/${savedVideoName}`;
            video.load();
          }
        }

        // استعادة نقطة التوقف الزمنية الأخيرة بدقة
        const savedTime = localStorage.getItem("lastVideoTime");
        if (savedTime && savedVideoName) {
          const setSavedTime = () => {
            video.currentTime = parseFloat(savedTime);
            video.removeEventListener("loadedmetadata", setSavedTime);
          };

          if (video.readyState >= 1) {
            video.currentTime = parseFloat(savedTime);
          } else {
            video.addEventListener("loadedmetadata", setSavedTime);
          }
        }
      });

      videoNameInput.addEventListener("keydown", (e) => {
        e.stopPropagation(); 

        if (e.key === "Enter") {
          e.preventDefault();
          let videoName = videoNameInput.value.trim();
          if (videoName) {
            localStorage.setItem("videoName", videoName);
            localStorage.setItem("isStandaloneVideo", "false");

            if (!videoName.toLowerCase().endsWith(".mp4")) {
              videoName += ".mp4";
            }

            const currentFolder = localStorage.getItem("selectedFolderName") || "File";
            videoSource.src = `../${currentFolder}/${videoName}`;
            video.src = `../${currentFolder}/${videoName}`;
            video.load(); 
            video.play().catch((err) => console.log("تحديث البث..."));
            videoNameInput.blur(); 
          }
        }
      });

      function triggerConfettiAnimation() {
        const confettiCount = 45; 
        for (let i = 0; i < confettiCount; i++) {
          const confetti = document.createElement("div");
          confetti.classList.add("confetti-piece");
          
          confetti.style.left = Math.random() * 100 + "vw";
          confetti.style.animationDelay = Math.random() * 1.5 + "s";
          confetti.style.animationDuration = (Math.random() * 2.5 + 2) + "s"; 
          
          const size = Math.random() * 20 + 20; 
          confetti.style.width = size + "px";
          confetti.style.height = size + "px";

          document.body.appendChild(confetti);
          
          setTimeout(() => {
            confetti.remove();
          }, 4500);
        }
      }

      notesBox.value = localStorage.getItem("myNotes") || "";
      notesBox.addEventListener("input", () => {
        localStorage.setItem("myNotes", notesBox.value);
      });

      video.addEventListener("click", () => { video.blur(); });
      toggleBtn.addEventListener("click", () => {
        timestamps.style.display = timestamps.style.display === "none" ? "block" : "none";
      });

      // معالج الاختصارات المركزي الشامل والمحدث
      document.addEventListener("keydown", (e) => {
        if (e.altKey && (e.key === "t" || e.key === "T" || e.key === "ف")) {
          e.preventDefault();
          insertTimestamp();
          return;
        }

        if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT" || e.ctrlKey) return;
        
        switch (e.key) {
          case "e":
          case "E":
          case "ث":
            if (e.altKey) {
              e.preventDefault();
              triggerConfettiAnimation(); 
            }
            break;
          case "ArrowRight": 
            e.preventDefault(); 
            video.currentTime += 5; 
            triggerPopover(true);
            break;
          case "ArrowLeft": 
            e.preventDefault(); 
            video.currentTime -= 5; 
            triggerPopover(false);
            break;
          case "ArrowUp": 
            e.preventDefault(); 
            video.volume = Math.min(video.volume + 0.05, 1); 
            volumeSlider.value = video.volume;
            break;
          case "ArrowDown": 
            e.preventDefault(); 
            video.volume = Math.max(video.volume - 0.05, 0); 
            volumeSlider.value = video.volume;
            break;
          case " ": 
            e.preventDefault(); 
            togglePlay();
            break;
          case "f": case "F": case "ب": 
            e.preventDefault(); 
            toggleFullscreen();
            break;
          case ">": case ".": 
            e.preventDefault(); 
            if (video.playbackRate < 2.5) video.playbackRate += 0.25; 
            break;
          case "<": case ",": 
            e.preventDefault(); 
            if (video.playbackRate > 0.25) video.playbackRate -= 0.25; 
            break;
        }
      });
    </script>
  </body>
</html>
