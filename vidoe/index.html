<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Player Project</title>
    <link rel="shortcut icon" href="./logo.ico" type="image/x-icon" />
    <style>
      :root {
        --bg-dark: #0f1621;
        --bg-dark-alt: #192231;
        --text-dark: #ffffff;
        --card-dark: #1a2230;
        --hover-dark: #223047;
        --shadow-dark: #2a3a55;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: var(--bg-dark);
        color: var(--text-dark);
        display: flex;
        justify-content: center;
        transition: background 0.3s, color 0.3s;
        overflow-x: hidden;
      }

      .container {
        max-width: 1234px;
        padding: 20px;
        width: 100%;
      }

      .video-wrapper {
        text-align: center;
      }

      video {
        width: 100%;
        border-radius: 10px;
        box-shadow: 0 0 10px var(--shadow-dark);
      }

      video:hover {
        transition: 0.3s all;
        box-shadow: 0 0 10px var(--hover-dark);
      }

      video:fullscreen {
        border-radius: 0;
      }

      .toggle-btn {
        margin: 15px 0;
        padding: 10px 20px;
        background: var(--bg-dark-alt);
        border: none;
        color: var(--text-dark);
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s all;
        font-weight: 600;
      }

      .toggle-btn:hover {
        background: var(--hover-dark);
      }

      .timestamps {
        background: var(--bg-dark-alt);
        border-radius: 8px;
        padding: 15px;
        max-height: 600px;
        overflow-y: auto;
      }

      .timestamps ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .timestamps li {
        padding: 8px;
        cursor: pointer;
        border-bottom: 1px solid var(--shadow-dark);
        font-weight: 600;
      }

      textarea {
        margin-top: 10px;
        border-radius: 10px;
        background-color: transparent;
        color: var(--text-dark);
        border: 1px solid var(--text-dark);
        outline: none;
        width: 100%;
        padding: 15px;
        height: 150px;
        font-size: 20px;
        resize: vertical;
      }

      #videoNameInput {
        margin-top: 15px;
        border-radius: 10px;
        background-color: transparent;
        color: var(--text-dark);
        border: 1px solid var(--text-dark);
        outline: none;
        width: 100%;
        padding: 12px 15px;
        font-size: 16px;
        transition: 0.3s all;
      }

      #videoNameInput:focus {
        border-color: #1db954;
      }

      .buttons-group {
        display: flex;
        gap: 10px;
        margin-top: 12px;
      }

      .folder-btn {
        padding: 11px 15px;
        background: #223047;
        border: 1px solid var(--shadow-dark);
        color: var(--text-dark);
        font-size: 15px;
        border-radius: 8px;
        cursor: pointer;
        flex: 1;
        font-weight: 600;
        transition: 0.3s all;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
      }

      .folder-btn:hover {
        background: #1db954;
        color: #fff;
        border-color: #1db954;
      }

      .clear-btn {
        padding: 11px 15px;
        background: #311919;
        border: 1px solid #552a2a;
        color: var(--text-dark);
        font-size: 15px;
        border-radius: 8px;
        cursor: pointer;
        flex: 1;
        font-weight: 600;
        transition: 0.3s all;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
      }

      .clear-btn:hover {
        background: #b91d1d;
        color: #fff;
        border-color: #b91d1d;
      }

      .files-dropdown {
        margin-top: 10px;
        background: #0f1621;
        border: 1px solid var(--shadow-dark);
        border-radius: 8px;
        max-height: 220px;
        overflow-y: auto;
        padding: 5px 0;
        list-style: none;
      }

      .files-dropdown li {
        padding: 10px 15px;
        cursor: pointer;
        font-size: 13px;
        border-bottom: 1px solid var(--shadow-dark);
        transition: 0.2s all;
        text-align: right;
        color: #e0e0e0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .files-dropdown li:hover {
        background: var(--hover-dark);
        color: #1db954;
        padding-right: 22px;
      }

      .timestamps li.active {
        background: linear-gradient(90deg, #172f58, #3a4242);
        color: lightskyblue;
      }

      .confetti-piece {
        position: fixed;
        top: -50px;
        width: 35px;
        height: 35px;
        background-image: url('confetti.png');
        background-size: contain;
        background-repeat: no-repeat;
        z-index: 9999;
        pointer-events: none;
        animation: fall linear forwards;
      }

      @keyframes fall {
        0% {
          transform: translateY(0) rotate(0deg);
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        100% {
          transform: translateY(105vh) rotate(360deg);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="video-wrapper">
        <video id="video" width="100%" height="700" poster="Dream.png" controls>
          <source src="" type="video/mp4" />
          Your browser does not support HTML5 video.
        </video>
      </div>

      <button id="toggleTimestamps" class="toggle-btn">⏱ Show/Hide Timestamps</button>

      <div id="timestamps" class="timestamps">
        <ul>
          <textarea id="notes" dir="rtl" placeholder="اكتب ملاحظاتك هنا... واستخدم الاختصار Alt + T لإدراج التوقيت الحالي"></textarea>

          <input
            type="text"
            id="videoNameInput"
            dir="rtl"
            placeholder="أدخل اسم ملف الفيديو هنا واضغط Enter..."
          />

          <input type="file" id="folderPicker" webkitdirectory directory multiple style="display: none;" />
          <input type="file" id="videoFilePicker" accept="video/mp4,video/*" style="display: none;" />
          
          <div class="buttons-group">
            <button id="viewFolderBtn" class="folder-btn">📁 عرض المجلد</button>
            <button id="chooseVideoBtn" class="folder-btn">🎥 اختيار فيديو</button>
            <button id="clearStorageBtn" class="clear-btn">🗑️ مسح التخزين</button>
          </div>
          
          <ul id="folderFilesList" class="files-dropdown" style="display: none;"></ul>
        </ul>
      </div>
    </div>

    <script>
      const video = document.getElementById("video");
      const timestamps = document.getElementById("timestamps");
      const toggleBtn = document.getElementById("toggleTimestamps");
      const notesBox = document.getElementById("notes");

      const videoNameInput = document.getElementById("videoNameInput");
      const videoSource = video.querySelector("source");

      const viewFolderBtn = document.getElementById("viewFolderBtn");
      const clearStorageBtn = document.getElementById("clearStorageBtn");
      const folderPicker = document.getElementById("folderPicker");
      const folderFilesList = document.getElementById("folderFilesList");

      const chooseVideoBtn = document.getElementById("chooseVideoBtn");
      const videoFilePicker = document.getElementById("videoFilePicker");

      let loadedVideoFiles = []; 
      const timestampItems = timestamps.querySelectorAll("li");

      // وظيفة تنسيق الوقت الرقمي وتحويله إلى صيغة [MM:SS]
      function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `[${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}] `;
      }

      // دالة إدراج الـ Timestamp في موضع مؤشر الكتابة الحالي (Cursor Position)
      function insertTimestamp() {
        const timestampText = formatTime(video.currentTime);
        const startPos = notesBox.selectionStart;
        const endPos = notesBox.selectionEnd;
        const currentText = notesBox.value;

        notesBox.value = currentText.substring(0, startPos) + timestampText + currentText.substring(endPos);
        
        // إعادة تركيز المؤشر مباشرة بعد النص المدرج حديثاً لضمان تجربة كتابة سلسة دون انقطاع
        notesBox.selectionStart = notesBox.selectionEnd = startPos + timestampText.length;
        notesBox.focus();

        // تحديث التخزين المحلي فوراً
        localStorage.setItem("myNotes", notesBox.value);
      }

      function renderFilesList(filesArray) {
        folderFilesList.innerHTML = "";
        const currentFolder = localStorage.getItem("selectedFolderName") || "File";
        
        filesArray.forEach((fileName) => {
          const li = document.createElement("li");
          li.textContent = `🎥 ${fileName}`;
          li.title = fileName;
          
          li.addEventListener("click", () => {
            videoNameInput.value = fileName;
            localStorage.setItem("videoName", fileName);

            videoSource.src = `../${currentFolder}/${fileName}`;
            video.src = `../${currentFolder}/${fileName}`;
            video.load();
            video.play().catch((err) => console.log("بث الفيديو..."));

            videoNameInput.blur();
          });
          folderFilesList.appendChild(li);
        });
      }

      viewFolderBtn.addEventListener("click", () => {
        if (loadedVideoFiles.length === 0) {
          folderPicker.click(); 
        } else {
          folderFilesList.style.display =
            folderFilesList.style.display === "none" ? "block" : "none";
        }
      });

      folderPicker.addEventListener("change", (e) => {
        const files = e.target.files;
        if (files.length === 0) return;

        const folderName = files[0].webkitRelativePath.split('/')[0];
        localStorage.setItem("selectedFolderName", folderName);

        loadedVideoFiles = [];
        for (let file of files) {
          if (file.name.toLowerCase().endsWith(".mp4")) {
            loadedVideoFiles.push(file.name);
          }
        }

        loadedVideoFiles.sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));

        if (loadedVideoFiles.length > 0) {
          localStorage.setItem("cachedFolderFiles", JSON.stringify(loadedVideoFiles));
          renderFilesList(loadedVideoFiles);
          folderFilesList.style.display = "block";
          
          const firstVideo = loadedVideoFiles[0];
          videoNameInput.value = firstVideo;
          localStorage.setItem("videoName", firstVideo);
          videoSource.src = `../${folderName}/${firstVideo}`;
          video.src = `../${folderName}/${firstVideo}`;
          video.load();
        } else {
          alert("لم يتم العثور على ملفات mp4 داخل المجلد المحدد!");
        }
      });

      chooseVideoBtn.addEventListener("click", () => {
        videoFilePicker.click();
      });

      videoFilePicker.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;

        videoNameInput.value = file.name;
        localStorage.setItem("videoName", file.name);

        const fileURL = URL.createObjectURL(file);
        videoSource.src = fileURL;
        video.src = fileURL;
        video.load();
        video.play().catch((err) => console.log("خطأ في تشغيل الفيديو المختار:", err));
      });

      clearStorageBtn.addEventListener("click", () => {
        if (confirm("هل أنت متأكد من مسح جميع البيانات الكاش وإعادة تهيئة المشغل؟")) {
          localStorage.clear();
          location.reload();
        }
      });

      // استرجاع البيانات ومزامنة مسار الفيديو التلقائي والوقت عند الإقلاع
      window.addEventListener("load", () => {
        const cachedFiles = localStorage.getItem("cachedFolderFiles");
        if (cachedFiles) {
          loadedVideoFiles = JSON.parse(cachedFiles);
          renderFilesList(loadedVideoFiles);
        }

        const currentFolder = localStorage.getItem("selectedFolderName") || "File";
        let savedVideoName = localStorage.getItem("videoName") || "";
        
        if (savedVideoName) {
          if (!savedVideoName.toLowerCase().endsWith(".mp4")) {
            savedVideoName += ".mp4";
          }
          videoNameInput.value = savedVideoName;
          
          if (!savedVideoName.startsWith("blob:")) {
            videoSource.src = `../${currentFolder}/${savedVideoName}`;
            video.src = `../${currentFolder}/${savedVideoName}`;
            video.load();
          }
        }

        // هندسة الاستئناف التلقائي لآخر توقيت تم حفظه في الجلسة السابقة
        const savedTime = localStorage.getItem("lastVideoTime");
        if (savedTime && savedVideoName) {
          const setSavedTime = () => {
            video.currentTime = parseFloat(savedTime);
            video.removeEventListener("loadedmetadata", setSavedTime);
          };

          if (video.readyState >= 1) {
            video.currentTime = parseFloat(savedTime);
          } else {
            video.addEventListener("loadedmetadata", setSavedTime);
          }
        }
      });

      videoNameInput.addEventListener("keydown", (e) => {
        e.stopPropagation(); 

        if (e.key === "Enter") {
          e.preventDefault();
          let videoName = videoNameInput.value.trim();
          if (videoName) {
            localStorage.setItem("videoName", videoName);

            if (!videoName.toLowerCase().endsWith(".mp4")) {
              videoName += ".mp4";
            }

            const currentFolder = localStorage.getItem("selectedFolderName") || "File";
            videoSource.src = `../${currentFolder}/${videoName}`;
            video.src = `../${currentFolder}/${videoName}`;
            video.load(); 
            video.play().catch((err) => console.log("تحديث البث..."));
            videoNameInput.blur(); 
          }
        }
      });

      function triggerConfettiAnimation() {
        const confettiCount = 45; 
        for (let i = 0; i < confettiCount; i++) {
          const confetti = document.createElement("div");
          confetti.classList.add("confetti-piece");
          
          confetti.style.left = Math.random() * 100 + "vw";
          confetti.style.animationDelay = Math.random() * 1.5 + "s";
          confetti.style.animationDuration = (Math.random() * 2.5 + 2) + "s"; 
          
          const size = Math.random() * 20 + 20; 
          confetti.style.width = size + "px";
          confetti.style.height = size + "px";

          document.body.appendChild(confetti);
          
          setTimeout(() => {
            confetti.remove();
          }, 4500);
        }
      }

      notesBox.value = localStorage.getItem("myNotes") || "";
      notesBox.addEventListener("input", () => {
        localStorage.setItem("myNotes", notesBox.value);
      });

      function updateActiveTimestamp() {
        const currentTime = video.currentTime;
        let activeFound = false;
        timestampItems.forEach((item) => {
          const time = parseFloat(item.getAttribute("data-time"));
          const nextItem = item.nextElementSibling;
          let nextTime = nextItem ? parseFloat(nextItem.getAttribute("data-time")) : Infinity;
          if (!activeFound && currentTime >= time && currentTime < nextTime) {
            item.classList.add("active");
            activeFound = true;
          } else {
            item.classList.remove("active");
          }
        });
      }
      video.addEventListener("timeupdate", updateActiveTimestamp);
      
      // حفظ التوقيت الحالي بشكل مستمر في الـ LocalStorage لمزامنة جلسة المذاكرة
      video.addEventListener("timeupdate", () => {
        localStorage.setItem("lastVideoTime", video.currentTime);
      });

      video.addEventListener("click", () => { video.blur(); });
      toggleBtn.addEventListener("click", () => {
        timestamps.style.display = timestamps.style.display === "none" ? "block" : "none";
      });

      // معالج الاختصارات المركزي الشامل
      document.addEventListener("keydown", (e) => {
        // فحص اختصار التوقيت Alt + T بشكل معزول أولاً ليعمل حتى داخل الـ Inputs والـ Textarea دون مشاكل
        if (e.altKey && (e.key === "t" || e.key === "T" || e.key === "ف")) {
          e.preventDefault();
          insertTimestamp();
          return;
        }

        if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT" || e.ctrlKey) return;
        
        switch (e.key) {
          case "e":
          case "E":
          case "ث":
            if (e.altKey) {
              e.preventDefault();
              triggerConfettiAnimation(); 
            }
            break;
          case "ArrowRight": e.preventDefault(); video.currentTime += 5; break;
          case "ArrowLeft": e.preventDefault(); video.currentTime -= 5; break;
          case "ArrowUp": e.preventDefault(); video.volume = Math.min(video.volume + 0.05, 1); break;
          case "ArrowDown": e.preventDefault(); video.volume = Math.max(video.volume - 0.05, 0); break;
          case " ": e.preventDefault(); if (video.paused) video.play(); else video.pause(); break;
          case "f": case "F": case "ب": e.preventDefault(); if (!document.fullscreenElement) video.requestFullscreen(); else document.exitFullscreen(); break;
          case ">": case ".": e.preventDefault(); if (video.playbackRate < 2.5) video.playbackRate += 0.25; break;
          case "<": case ",": e.preventDefault(); if (video.playbackRate > 0.25) video.playbackRate -= 0.25; break;
        }
      });
    </script>
  </body>
</html>
