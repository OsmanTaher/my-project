<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maze Escape - Neon Edition</title>
    <style>
        :root {
    --bg-color: #0B1121;
    --neon-cyan: #00f0ff;
    --neon-pink: #ff007f;
    --neon-green: #39ff14;
    --neon-red: #ff3333;
    --neon-gold: #ffbd00;
    --panel-bg: rgba(16, 24, 48, 0.85);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
}

body {
    background-color: var(--bg-color);
    color: #ffffff;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.game-container {
    width: 100%;
    max-width: 700px;
    height: 100vh;
    max-height: 950px;
    display: flex;
    flex-direction: column;
    padding: 15px;
    background: radial-gradient(circle at center, #14203d 0%, var(--bg-color) 100%);
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
    border-radius: 12px;
    border: 1px solid rgba(0, 240, 255, 0.1);
}

/* Header UI */
.game-header {
    display: flex;
    justify-content: space-between;
    background: var(--panel-bg);
    padding: 12px 20px;
    border-radius: 8px;
    border: 1px solid rgba(0, 240, 255, 0.2);
    margin-bottom: 15px;
}

.stat-box {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.stat-box .label {
    font-size: 0.75rem;
    text-transform: uppercase;
    color: #8a99ad;
    letter-spacing: 1px;
    margin-bottom: 4px;
}

.stat-box .value {
    font-size: 1.3rem;
    font-weight: bold;
}

/* Viewport & Canvases */
.game-viewport {
    position: relative;
    flex: 1;
    background: rgba(5, 8, 16, 0.9);
    border-radius: 8px;
    border: 2px solid var(--neon-cyan);
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

#gameCanvas {
    display: block;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

#minimapCanvas {
    position: absolute;
    bottom: 15px;
    right: 15px;
    width: 100px;
    height: 100px;
    background: rgba(11, 17, 33, 0.85);
    border: 1px solid var(--neon-pink);
    border-radius: 4px;
    box-shadow: 0 0 8px rgba(250, 0, 127, 0.3);
    pointer-events: none;
}

/* Overlays Setup */
.overlay {
    position: absolute;
    inset: 0;
    background: rgba(11, 17, 33, 0.95);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
    padding: 20px;
    text-align: center;
    backdrop-filter: blur(4px);
    transition: all 0.3s ease;
}

.overlay.active {
    display: flex;
}

/* Typography & Neon FX */
.neon-title {
    font-size: 2.8rem;
    letter-spacing: 4px;
    color: #fff;
    text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-cyan);
    margin-bottom: 8px;
}

.neon-text { text-shadow: 0 0 10px var(--neon-cyan); color: var(--neon-cyan); }
.neon-text-green { text-shadow: 0 0 10px var(--neon-green); color: var(--neon-green); }
.neon-text-red { text-shadow: 0 0 10px var(--neon-red); color: var(--neon-red); }

.subtitle { color: #8a99ad; margin-bottom: 30px; font-size: 0.95rem;}

/* Buttons & Inputs */
.btn {
    padding: 12px 35px;
    font-size: 1rem;
    font-weight: bold;
    letter-spacing: 2px;
    background: transparent;
    color: #fff;
    border: 2px solid var(--neon-cyan);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s ease;
    margin: 10px 0;
    box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
}

.btn:hover {
    background: var(--neon-cyan);
    color: var(--bg-color);
    box-shadow: 0 0 20px var(--neon-cyan);
}

.btn-sm {
    padding: 6px 14px;
    background: transparent;
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.75rem;
}

.btn-sm:hover { border-color: var(--neon-cyan); color: var(--neon-cyan); }
.btn-danger:hover { border-color: var(--neon-red); color: var(--neon-red); }

select {
    background: #101830;
    color: #fff;
    border: 1px solid var(--neon-cyan);
    padding: 8px 15px;
    border-radius: 4px;
    font-size: 1rem;
    outline: none;
    margin-left: 10px;
}

.control-group { margin-bottom: 25px; }

/* Footer & Virtual Controls */
.game-footer {
    margin-top: 15px;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.action-buttons {
    display: flex;
    justify-content: space-between;
}

.mobile-controls {
    display: grid;
    grid-template-columns: repeat(3, 65px);
    grid-template-rows: repeat(2, 60px);
    gap: 8px;
    justify-content: center;
    margin: 5px auto;
}

.dpad-btn {
    background: rgba(20, 32, 61, 0.7);
    border: 1px solid rgba(0, 240, 255, 0.3);
    border-radius: 8px;
    color: #fff;
    font-size: 1.2rem;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
}

.dpad-btn:active {
    background: var(--neon-cyan);
    color: var(--bg-color);
    box-shadow: 0 0 15px var(--neon-cyan);
}

.dpad-btn.up { grid-column: 2; }
.dpad-btn.left { grid-column: 1; grid-row: 2; }
.dpad-space { grid-column: 2; grid-row: 2; pointer-events: none;}
.dpad-btn.right { grid-column: 3; grid-row: 2; }
.dpad-btn.down { grid-column: 2; grid-row: 2; z-index: 2;}

/* Responsive Adaptations */
@media(min-width: 769px) {
    .mobile-controls { display: none; }
}

@media(max-width: 768px) {
    .game-container { padding: 8px; height: 100vh; border-radius: 0; }
    .neon-title { font-size: 2rem; }
    #minimapCanvas { width: 75px; height: 75px; }
}

/* Animations */
@keyframes technicalBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}
.technical-blink { animation: technicalBlink 1.5s infinite; }

@keyframes completeAnim {
    0% { transform: scale(0.9); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}
.complete-anim { animation: completeAnim 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <div class="stat-box">
                <span class="label">Level</span>
                <span id="level-val" class="value neon-text">1</span>
            </div>
            <div class="stat-box">
                <span class="label">Score</span>
                <span id="score-val" class="value neon-text-green">0</span>
            </div>
            <div class="stat-box">
                <span class="label">Time</span>
                <span id="timer-val" class="value neon-text-red">60</span>
            </div>
            <div class="stat-box">
                <span class="label">Moves</span>
                <span id="moves-val" class="value">0</span>
            </div>
        </header>

        <main class="game-viewport">
            <canvas id="gameCanvas"></canvas>
            <canvas id="minimapCanvas"></canvas>

            <div id="start-screen" class="overlay active">
                <h1 class="neon-title">MAZE ESCAPE</h1>
                <p class="subtitle">Navigate the cyber grid. Find the core.</p>
                <div class="control-group">
                    <label for="difficulty-select">Select Difficulty:</label>
                    <select id="difficulty-select">
                        <option value="easy">Easy (10x10)</option>
                        <option value="medium" selected>Medium (20x20)</option>
                        <option value="hard">Hard (30x30)</option>
                    </select>
                </div>
                <button id="start-btn" class="btn neon-btn">INITIALIZE</button>
            </div>

            <div id="pause-screen" class="overlay">
                <h2 class="neon-text">SYSTEM PAUSED</h2>
                <button id="resume-btn" class="btn neon-btn">RESUME</button>
                <button id="restart-btn" class="btn neon-btn-red">RESTART</button>
            </div>

            <div id="victory-screen" class="overlay">
                <h2 class="neon-text-green complete-anim">LEVEL CLEARED</h2>
                <p class="score-bonus">Coins Collected: <span id="coins-collected">0</span></p>
                <button id="next-lvl-btn" class="btn neon-btn">NEXT GRID</button>
            </div>

            <div id="gameover-screen" class="overlay">
                <h2 class="neon-text-red technical-blink">SYSTEM FAILURE</h2>
                <p>Time expired or trap triggered.</p>
                <button id="retry-btn" class="btn neon-btn">REBOOT</button>
            </div>
        </main>

        <footer class="game-footer">
            <div class="action-buttons">
                <button id="pause-btn" class="btn-sm">PAUSE</button>
                <button id="reset-progress-btn" class="btn-sm btn-danger">RESET ALL</button>
            </div>

            <div class="mobile-controls">
                <button class="dpad-btn up" data-dir="UP">▲</button>
                <button class="dpad-btn left" data-dir="LEFT">◀</button>
                <div class="dpad-space"></div>
                <button class="dpad-btn right" data-dir="RIGHT">▶</button>
                <button class="dpad-btn down" data-dir="DOWN">▼</button>
            </div>
        </footer>
    </div>

    <script>
        // --- Core Math/Algorithms: Maze Generation Matrix ---
class Maze {
    constructor(cols, rows) {
        this.cols = cols;
        this.rows = rows;
        this.grid = [];
        this.initGrid();
    }

    initGrid() {
        for (let r = 0; r < this.rows; r++) {
            let row = [];
            for (let c = 0; c < this.cols; c++) {
                row.push({
                    r, c,
                    walls: { top: true, right: true, bottom: true, left: true },
                    visited: false,
                    type: 'empty' // 'empty', 'coin', 'trap'
                });
            }
            this.grid.push(row);
        }
    }

    generate() {
        let stack = [];
        let current = this.grid[0][0];
        current.visited = true;

        while (true) {
            let next = this.getUnvisitedNeighbor(current);
            if (next) {
                next.visited = true;
                stack.push(current);
                this.removeWalls(current, next);
                current = next;
            } else if (stack.length > 0) {
                current = stack.pop();
            } else {
                break;
            }
        }
        this.generateItems();
    }

    getUnvisitedNeighbor(cell) {
        let neighbors = [];
        let { r, c } = cell;

        if (r > 0 && !this.grid[r - 1][c].visited) neighbors.push(this.grid[r - 1][c]);
        if (c < this.cols - 1 && !this.grid[r][c + 1].visited) neighbors.push(this.grid[r][c + 1]);
        if (r < this.rows - 1 && !this.grid[r + 1][c].visited) neighbors.push(this.grid[r + 1][c]);
        if (c > 0 && !this.grid[r][c - 1].visited) neighbors.push(this.grid[r][c - 1]);

        if (neighbors.length > 0) {
            let index = Math.floor(Math.random() * neighbors.length);
            return neighbors[index];
        }
        return null;
    }

    removeWalls(cell1, cell2) {
        let x = cell1.c - cell2.c;
        if (x === 1) { cell1.walls.left = false; cell2.walls.right = false; }
        else if (x === -1) { cell1.walls.right = false; cell2.walls.left = false; }

        let y = cell1.r - cell2.r;
        if (y === 1) { cell1.walls.top = false; cell2.walls.bottom = false; }
        else if (y === -1) { cell1.walls.bottom = false; cell2.walls.top = false; }
    }

    generateItems() {
        // Distribute Coins and Traps evenly avoiding start (0,0) and exit (last, last)
        for (let r = 0; r < this.rows; r++) {
            for (let c = 0; c < this.cols; c++) {
                if ((r === 0 && c === 0) || (r === this.rows - 1 && c === this.cols - 1)) continue;
                
                let rand = Math.random();
                if (rand < 0.08) {
                    this.grid[r][c].type = 'coin';
                } else if (rand > 0.08 && rand < 0.12) {
                    this.grid[r][c].type = 'trap';
                }
            }
        }
    }
}

// --- Main Engine Architecture ---
class GameEngine {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.minimapCanvas = document.getElementById('minimapCanvas');
        this.mmCtx = this.minimapCanvas.getContext('2d');

        // State Machine Initializers
        this.gameState = {
            level: 1,
            score: 0,
            moves: 0,
            timeRemaining: 60,
            difficulty: 'medium',
            isPlaying: false,
            isPaused: false
        };

        this.maze = null;
        this.player = { r: 0, c: 0 };
        this.timerInterval = null;
        this.cellSize = 0;

        // Custom Swipe Mechanics State
        this.touchStartPoint = { x: 0, y: 0 };

        this.initDOMEvents();
        this.loadProgress();
    }

    initDOMEvents() {
        document.getElementById('start-btn').addEventListener('click', () => this.startGame(true));
        document.getElementById('pause-btn').addEventListener('click', () => this.togglePause());
        document.getElementById('resume-btn').addEventListener('click', () => this.togglePause());
        document.getElementById('restart-btn').addEventListener('click', () => this.restartLevel());
        document.getElementById('next-lvl-btn').addEventListener('click', () => this.nextLevel());
        document.getElementById('retry-btn').addEventListener('click', () => this.restartLevel());
        document.getElementById('reset-progress-btn').addEventListener('click', () => this.resetGlobalProgress());

        // Select Input Handler
        document.getElementById('difficulty-select').addEventListener('change', (e) => {
            this.gameState.difficulty = e.target.value;
        });

        // Event Keyboards Listener
        window.addEventListener('keydown', (e) => this.handleKeyDown(e));

        // Mobile D-pad Integration
        document.querySelectorAll('.dpad-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                let dir = e.currentTarget.getAttribute('data-dir');
                this.movePlayer(dir);
            });
        });

        // Touch Interaction Patterns (Swipes)
        this.canvas.addEventListener('touchstart', (e) => {
            this.touchStartPoint.x = e.touches[0].clientX;
            this.touchStartPoint.y = e.touches[0].clientY;
        }, { passive: true });

        this.canvas.addEventListener('touchend', (e) => {
            if (!this.gameState.isPlaying || this.gameState.isPaused) return;
            let diffX = e.changedTouches[0].clientX - this.touchStartPoint.x;
            let diffY = e.changedTouches[0].clientY - this.touchStartPoint.y;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (Math.abs(diffX) > 30) this.movePlayer(diffX > 0 ? 'RIGHT' : 'LEFT');
            } else {
                if (Math.abs(diffY) > 30) this.movePlayer(diffY > 0 ? 'DOWN' : 'UP');
            }
        }, { passive: true });

        // High DPI Canvas Scaling Watcher
        window.addEventListener('resize', () => this.resizeCanvas());
    }

    startGame(resetStats = false) {
        if (resetStats) {
            this.gameState.score = 0;
            this.gameState.level = 1;
        }
        this.gameState.moves = 0;
        this.gameState.isPlaying = true;
        this.gameState.isPaused = false;
        
        // Dynamic Matrix Scale Multipliers based on progression
        let sizeMap = { easy: 10, medium: 20, hard: 30 };
        let baseline = sizeMap[this.gameState.difficulty];
        let growthModifier = Math.floor((this.gameState.level - 1) * 2);
        
        this.maze = new Maze(baseline + growthModifier, baseline + growthModifier);
        this.maze.generate();
        
        this.player = { r: 0, c: 0 };
        this.gameState.timeRemaining = Math.max(30, baseline * 4 - (this.gameState.level * 2));

        // Display Switching Engine
        this.hideOverlays();
        this.resizeCanvas();
        this.startTimer();
        this.updateUI();
        this.saveProgress();
    }

    startTimer() {
        clearInterval(this.timerInterval);
        this.timerInterval = setInterval(() => {
            if (!this.gameState.isPaused && this.gameState.isPlaying) {
                this.gameState.timeRemaining--;
                document.getElementById('timer-val').innerText = this.gameState.timeRemaining;
                if (this.gameState.timeRemaining <= 0) {
                    this.triggerGameOver();
                }
            }
        }, 1000);
    }

    togglePause() {
        if (!this.gameState.isPlaying) return;
        this.gameState.isPaused = !this.gameState.isPaused;
        document.getElementById('pause-screen').classList.toggle('active', this.gameState.isPaused);
        if (!this.gameState.isPaused) this.render();
    }

    restartLevel() {
        this.startGame(false);
    }

    nextLevel() {
        this.gameState.level++;
        this.startGame(false);
    }

    handleKeyDown(e) {
        if (!this.gameState.isPlaying || this.gameState.isPaused) return;
        const keyMap = {
            'ArrowUp': 'UP', 'KeyW': 'UP',
            'ArrowDown': 'DOWN', 'KeyS': 'DOWN',
            'ArrowLeft': 'LEFT', 'KeyA': 'LEFT',
            'ArrowRight': 'RIGHT', 'KeyD': 'RIGHT'
        };
        if (keyMap[e.code]) {
            e.preventDefault();
            this.movePlayer(keyMap[e.code]);
        }
    }

    movePlayer(direction) {
        let currentCell = this.maze.grid[this.player.r][this.player.c];
        let targetCellPos = { r: this.player.r, c: this.player.c };

        if (direction === 'UP' && !currentCell.walls.top) targetCellPos.r--;
        else if (direction === 'DOWN' && !currentCell.walls.bottom) targetCellPos.r++;
        else if (direction === 'LEFT' && !currentCell.walls.left) targetCellPos.c--;
        else if (direction === 'RIGHT' && !currentCell.walls.right) targetCellPos.c++;

        if (targetCellPos.r !== this.player.r || targetCellPos.c !== this.player.c) {
            this.player.r = targetCellPos.r;
            this.player.c = targetCellPos.c;
            this.gameState.moves++;
            this.checkCellInteractions();
            this.updateUI();
            this.render();
        }
    }

    checkCellInteractions() {
        let cell = this.maze.grid[this.player.r][this.player.c];
        
        if (cell.type === 'coin') {
            this.gameState.score += 150;
            cell.type = 'empty';
        } else if (cell.type === 'trap') {
            this.gameState.score = Math.max(0, this.gameState.score - 200);
            this.gameState.timeRemaining = Math.max(0, this.gameState.timeRemaining - 10);
            cell.type = 'empty';
            if(this.gameState.timeRemaining <= 0) this.triggerGameOver();
        }

        // Win Condition Pipeline check
        if (this.player.r === this.maze.rows - 1 && this.player.c === this.maze.cols - 1) {
            this.triggerWin();
        }
    }

    triggerWin() {
        this.gameState.isPlaying = false;
        clearInterval(this.timerInterval);
        this.gameState.score += this.gameState.timeRemaining * 10; // Time bonus calculation
        this.saveProgress();
        
        document.getElementById('victory-screen').classList.add('active');
    }

    triggerGameOver() {
        this.gameState.isPlaying = false;
        clearInterval(this.timerInterval);
        document.getElementById('gameover-screen').classList.add('active');
    }

    resizeCanvas() {
        const viewport = this.canvas.parentElement;
        const targetSize = Math.min(viewport.clientWidth, viewport.clientHeight) - 20;
        
        this.canvas.width = targetSize;
        this.canvas.height = targetSize;
        
        if (this.maze) {
            this.cellSize = this.canvas.width / this.maze.cols;
            this.render();
        }
    }

    render() {
        if (!this.maze || !this.gameState.isPlaying) return;
        
        // Draw Main Viewport Matrix Frame
        this.ctx.fillStyle = '#0B1121';
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

        // Vector Render Matrix Blocks
        for (let r = 0; r < this.maze.rows; r++) {
            for (let c = 0; c < this.maze.cols; c++) {
                this.renderCell(this.ctx, this.maze.grid[r][c], this.cellSize);
            }
        }
        
        // Render Active Sub-Entities
        this.renderEntities(this.ctx, this.cellSize);
        
        // Map Vector Frame Updates
        this.renderMinimap();
    }

    renderCell(context, cell, size) {
        let x = cell.c * size;
        let y = cell.r * size;

        context.strokeStyle = 'rgba(0, 240, 255, 0.4)';
        context.lineWidth = 2;
        context.shadowBlur = 0; // Default flat fallback for clean boundaries

        if (cell.walls.top) { context.beginPath(); context.moveTo(x, y); context.lineTo(x + size, y); context.stroke(); }
        if (cell.walls.right) { context.beginPath(); context.moveTo(x + size, y); context.lineTo(x + size, y + size); context.stroke(); }
        if (cell.walls.bottom) { context.beginPath(); context.moveTo(x, y + size); context.lineTo(x + size, y + size); context.stroke(); }
        if (cell.walls.left) { context.beginPath(); context.moveTo(x, y); context.lineTo(x, y + size); context.stroke(); }

        // Render Internal Matrix Assets
        if (cell.type === 'coin') {
            context.fillStyle = '#ffbd00';
            context.beginPath();
            context.arc(x + size / 2, y + size / 2, size * 0.22, 0, Math.PI * 2);
            context.fill();
        } else if (cell.type === 'trap') {
            context.fillStyle = '#ff3333';
            context.beginPath();
            context.moveTo(x + size / 2, y + size * 0.2);
            context.lineTo(x + size * 0.8, y + size * 0.8);
            context.lineTo(x + size * 0.2, y + size * 0.8);
            context.closePath();
            context.fill();
        }
    }

    renderEntities(context, size) {
        // Core Target Exit Vector System
        let exitX = (this.maze.cols - 1) * size;
        let exitY = (this.maze.rows - 1) * size;
        context.fillStyle = '#ff007f';
        context.shadowColor = '#ff007f';
        context.shadowBlur = size * 0.5;
        context.fillRect(exitX + size * 0.15, exitY + size * 0.15, size * 0.7, size * 0.7);

        // Standard Dynamic Active User Node Vector
        let pX = this.player.c * size;
        let pY = this.player.r * size;
        context.fillStyle = '#00f0ff';
        context.shadowColor = '#00f0ff';
        context.shadowBlur = size * 0.6;
        context.beginPath();
        context.arc(pX + size / 2, pY + size / 2, size * 0.35, 0, Math.PI * 2);
        context.fill();
        
        // Flush structural contexts shadow buffers instantly
        context.shadowBlur = 0;
    }

    renderMinimap() {
        this.mmCtx.fillStyle = '#0B1121';
        this.mmCtx.fillRect(0, 0, this.minimapCanvas.width, this.minimapCanvas.height);

        let mmCellWidth = this.minimapCanvas.width / this.maze.cols;
        let mmCellHeight = this.minimapCanvas.height / this.maze.rows;

        // Draw structural paths
        this.mmCtx.fillStyle = 'rgba(0, 240, 255, 0.15)';
        for (let r = 0; r < this.maze.rows; r++) {
            for (let c = 0; c < this.maze.cols; c++) {
                this.mmCtx.fillRect(c * mmCellWidth, r * mmCellHeight, mmCellWidth, mmCellHeight);
            }
        }

        // Micro Pointer Indicators
        this.mmCtx.fillStyle = '#ff007f';
        this.mmCtx.fillRect((this.maze.cols - 1) * mmCellWidth, (this.maze.rows - 1) * mmCellHeight, mmCellWidth, mmCellHeight);

        this.mmCtx.fillStyle = '#00f0ff';
        this.mmCtx.fillRect(this.player.c * mmCellWidth, this.player.r * mmCellHeight, mmCellWidth, mmCellHeight);
    }

    updateUI() {
        document.getElementById('level-val').innerText = this.gameState.level;
        document.getElementById('score-val').innerText = this.gameState.score;
        document.getElementById('moves-val').innerText = this.gameState.moves;
        document.getElementById('timer-val').innerText = this.gameState.timeRemaining;
    }

    hideOverlays() {
        document.querySelectorAll('.overlay').forEach(el => el.classList.remove('active'));
    }

    // --- Persistence Management Engine layer (Local Storage) ---
    saveProgress() {
        localStorage.setItem('maze_escape_save', JSON.stringify({
            level: this.gameState.level,
            score: this.gameState.score,
            difficulty: this.gameState.difficulty
        }));
    }

    loadProgress() {
        let data = localStorage.getItem('maze_escape_save');
        if (data) {
            let parsed = JSON.parse(data);
            this.gameState.level = parsed.level || 1;
            this.gameState.score = parsed.score || 0;
            this.gameState.difficulty = parsed.difficulty || 'medium';
            
            document.getElementById('difficulty-select').value = this.gameState.difficulty;
            this.updateUI();
        }
    }

    resetGlobalProgress() {
        localStorage.removeItem('maze_escape_save');
        this.gameState.level = 1;
        this.gameState.score = 0;
        this.gameState.difficulty = 'medium';
        document.getElementById('difficulty-select').value = 'medium';
        this.hideOverlays();
        document.getElementById('start-screen').classList.add('active');
        this.updateUI();
        clearInterval(this.timerInterval);
    }
}

// Instantiate Module on Engine Execution Thread
document.addEventListener('DOMContentLoaded', () => {
    new GameEngine();
});
    </script>
</body>
