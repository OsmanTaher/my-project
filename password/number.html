<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحول العلمي المتقدم للوحدات</title>
    <style>
        /* نظام الألوان والثيم الداكن الاحترافي */
        :root {
            --bg-main: #0B1121;
            --bg-card: #131B2E;
            --accent: #4AE2DC;
            --accent-hover: #3cd0ca;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border: #1E293B;
            --input-bg: #0B1121;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        /* حاوية الأداة الرئيسية */
        .converter-container {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 100%;
            max-width: 600px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 
                        0 0 50px rgba(74, 226, 220, 0.02);
            animation: appEntry 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* اختيار الفئة */
        .category-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        select, input {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }

        select:focus, input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(74, 226, 220, 0.1);
        }

        /* شبكة التحكم بالتحويلات */
        .conversion-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            align-items: end;
            margin-bottom: 1.5rem;
        }

        @media (min-width: 768px) {
            .conversion-grid {
                grid-template-columns: 1fr auto 1fr;
            }
        }

        .unit-block {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        /* زر التبديل (Swap) */
        .swap-wrapper {
            display: flex;
            justify-content: center;
            padding-bottom: 0.2rem;
        }

        .swap-btn {
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            width: 42px;
            height: 42px;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
        }

        .swap-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: rotate(180deg);
        }

        /* خانة النتيجة والنسخ */
        .result-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .result-wrapper input {
            padding-left: 3rem; /* مساحة لزر النسخ */
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: var(--accent);
        }

        .copy-btn {
            position: absolute;
            left: 8px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            color: var(--accent);
            background-color: rgba(74, 226, 220, 0.05);
        }

        /* تلميح التأكيد المنبثق */
        .toast {
            position: fixed;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--accent);
            color: var(--bg-main);
            padding: 0.6rem 1.5rem;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(74, 226, 220, 0.2);
            z-index: 1000;
        }

        .toast.show {
            bottom: 30px;
            opacity: 1;
        }

        /* تحييد اتجاه المدخلات الرقمية والعلمية ليصبح يسار ويمين بشكل منضبط */
        input[type="number"], .output-field {
            direction: ltr;
            text-align: right;
        }

        @keyframes appEntry {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="converter-container">
        <header>
            <h1>المحول العلمي للمقاييس والوحدات</h1>
            <p>تحويل فوري فائق الدقة للوحدات الفيزيائية والعلمية المركبة</p>
        </header>

        <div class="category-group">
            <label for="category-select">فئة القياس</label>
            <select id="category-select">
                <option value="length">الطول (Length)</option>
                <option value="weight">الوزن / الكتلة (Weight / Mass)</option>
                <option value="temperature">درجة الحرارة (Temperature)</option>
                <option value="pressure">الضغط (Pressure)</option>
                <option value="speed">السرعة (Speed)</option>
            </select>
        </div>

        <div class="conversion-grid">
            <div class="unit-block">
                <label for="input-value">القيمة المدخلة</label>
                <input type="number" id="input-value" value="1" step="any" placeholder="أدخل القيمة">
                <select id="from-unit-select"></select>
            </div>

            <div class="swap-wrapper">
                <button class="swap-btn" id="swap-button" title="تبديل الوحدات">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
                </button>
            </div>

            <div class="unit-block">
                <label for="output-value">النتيجة المحسوبة</label>
                <div class="result-wrapper">
                    <input type="text" id="output-value" class="output-field" readonly>
                    <button class="copy-btn" id="copy-button" title="نسخ النتيجة">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    </button>
                </div>
                <select id="to-unit-select"></select>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">تم نسخ النتيجة العلمية بنجاح!</div>

    <script>
        // هيكل البيانات الأساسي الشامل لجميع فئات القياس
        const conversionRates = {
            length: {
                base: 'm', // الوحدة المعيارية الأساسية: المتر
                units: {
                    m: { name: 'متر (m)', factor: 1 },
                    cm: { name: 'سانتيمتر (cm)', factor: 100 },
                    mm: { name: 'مليمتر (mm)', factor: 1000 },
                    km: { name: 'كيلومتر (km)', factor: 0.001 },
                    inch: { name: 'بوصة (in)', factor: 39.3700787 },
                    ft: { name: 'قدم (ft)', factor: 3.2808399 },
                    mi: { name: 'ميل (mi)', factor: 0.000621371 }
                }
            },
            weight: {
                base: 'kg', // الوحدة المعيارية الأساسية: الكيلوجرام
                units: {
                    kg: { name: 'كيلوجرام (kg)', factor: 1 },
                    g: { name: 'جرام (g)', factor: 1000 },
                    mg: { name: 'مليجرام (mg)', factor: 1000000 },
                    lb: { name: 'باوند / رطل (lb)', factor: 2.20462262 },
                    oz: { name: 'أونصة (oz)', factor: 35.2739619 }
                }
            },
            temperature: {
                base: 'C', // الوحدة المعيارية الأساسية: السيليزيوس (تتطلب دوال خطية مخصصة بدلاً من المعامل الثابت)
                units: {
                    C: { name: 'درجة مئوية (°C)', toBase: v => v, fromBase: v => v },
                    F: { name: 'فهرنهايت (°F)', toBase: v => (v - 32) * 5/9, fromBase: v => (v * 9/5) + 32 },
                    K: { name: 'كيلفن (K)', toBase: v => v - 273.15, fromBase: v => v + 273.15 }
                }
            },
            pressure: {
                base: 'pa', // الوحدة المعيارية الأساسية: الباسكال
                units: {
                    pa: { name: 'باسكال (Pa)', factor: 1 },
                    bar: { name: 'بار (bar)', factor: 1e-5 },
                    atm: { name: 'ضغط جوي القياسي (atm)', factor: 9.86923267e-6 },
                    psi: { name: 'رطل لكل بوصة مربعة (psi)', factor: 0.0001450377 }
                }
            },
            speed: {
                base: 'm_s', // الوحدة المعيارية الأساسية: متر لكل ثانية
                units: {
                    m_s: { name: 'متر / ثانية (m/s)', factor: 1 },
                    km_h: { name: 'كيلومتر / ساعة (km/h)', factor: 3.6 },
                    mph: { name: 'ميل / ساعة (mph)', factor: 2.23693629 },
                    knot: { name: 'عقدة بحرية (knot)', factor: 1.94384449 }
                }
            }
        };

        // الإمساك بعناصر الواجهة
        const categorySelect = document.getElementById('category-select');
        const inputValue = document.getElementById('input-value');
        const outputValue = document.getElementById('output-value');
        const fromUnitSelect = document.getElementById('from-unit-select');
        const toUnitSelect = document.getElementById('to-unit-select');
        const swapButton = document.getElementById('swap-button');
        const copyButton = document.getElementById('copy-button');
        const toast = document.getElementById('toast');

        // تعبئة القوائم ديناميكياً بناء على الفئة المختارة
        function populateUnits() {
            const category = categorySelect.value;
            const unitsObj = conversionRates[category].units;
            
            // تخزين الخيارات السابقة لتجنب تصفيرها بالكامل إن كانت متطابقة عند إضافة فئات
            const prevFrom = fromUnitSelect.value;
            const prevTo = toUnitSelect.value;

            fromUnitSelect.innerHTML = '';
            toUnitSelect.innerHTML = '';

            Object.keys(unitsObj).forEach(key => {
                const optFrom = document.createElement('option');
                optFrom.value = key;
                optFrom.textContent = unitsObj[key].name;
                fromUnitSelect.appendChild(optFrom);

                const optTo = document.createElement('option');
                optTo.value = key;
                optTo.textContent = unitsObj[key].name;
                toUnitSelect.appendChild(optTo);
            });

            // ضبط الاختيارات التلقائية (الأول والثاني لعدم تكرار نفس الوحدة بالبداية)
            if(fromUnitSelect.options.length > 1) {
                toUnitSelect.selectedIndex = 1;
            }
            
            performConversion();
        }

        // صياغة وعرض الأرقام الضخمة أو المتناهية الصغر بالصيغة العلمية (Scientific Notation) بدقة
        function formatScientificNumber(value) {
            if (value === 0) return '0';
            const absVal = Math.abs(value);
            
            // تفعيل الصيغة الأسية إذا كان الرقم شديد الصغر أو الضخامة
            if (absVal < 1e-5 || absVal >= 1e6) {
                return value.toExponential(6);
            }
            // تقريب الكسور الطويلة لمنع مشاكل العطف الرياضي للنظام الثنائي Floating-point
            return parseFloat(value.toFixed(8)).toString();
        }

        // محرك التحويل اللحظي (The Core Conversion Engine)
        function performConversion() {
            const categoryKey = categorySelect.value;
            const fromKey = fromUnitSelect.value;
            const toKey = toUnitSelect.value;
            const inputNum = parseFloat(inputValue.value);

            if (isNaN(inputNum)) {
                outputValue.value = '';
                return;
            }

            const currentCategory = conversionRates[categoryKey];
            const fromUnit = currentCategory.units[fromKey];
            const toUnit = currentCategory.units[toKey];

            // الخطوة 1: تحويل القيمة المدخلة إلى القيمة المعيارية الموحدة (Base Unit)
            let baseValue;
            if (fromUnit.toBase) {
                baseValue = fromUnit.toBase(inputNum); // معالجة الحالات الشاذة كالحرارة
            } else {
                baseValue = inputNum / fromUnit.factor;
            }

            // الخطوة 2: تحويل القيمة المعيارية من الـ Base Unit إلى الوحدة المستهدفة النهائية
            let finalValue;
            if (toUnit.fromBase) {
                finalValue = toUnit.fromBase(baseValue);
            } else {
                finalValue = baseValue * toUnit.factor;
            }

            outputValue.value = formatScientificNumber(finalValue);
        }

        // منطق زر التبديل (Swap)
        swapButton.addEventListener('click', () => {
            const temp = fromUnitSelect.value;
            fromUnitSelect.value = toUnitSelect.value;
            toUnitSelect.value = temp;
            performConversion();
        });

        // منطق نسخ النتيجة البرمجي
        copyButton.addEventListener('click', () => {
            if (!outputValue.value) return;
            navigator.clipboard.writeText(outputValue.value).then(() => {
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            });
        });

        // تفعيل الاستماع اللحظي للتحديث (Live Conversion)
        categorySelect.addEventListener('change', populateUnits);
        fromUnitSelect.addEventListener('change', performConversion);
        toUnitSelect.addEventListener('change', performConversion);
        inputValue.addEventListener('input', performConversion);

        // تشغيل التهيئة الأولية عند تحميل الصفحة
        populateUnits();
    </script>
</body>
</html>
