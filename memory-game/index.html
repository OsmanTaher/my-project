<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة العناصر: لعبة الذاكرة الأسطورية</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cairo Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
        }
        /* Custom neon text-shadow glows */
        .neon-glow-teal {
            text-shadow: 0 0 10px rgba(20, 184, 166, 0.6);
        }
        .neon-glow-rose {
            text-shadow: 0 0 10px rgba(244, 63, 94, 0.6);
        }
        /* 3D Card Flipping Core Styles */
        .card-container {
            perspective: 1000px;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .is-flipped .card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 1.25rem;
        }
        /* Style card front (hidden face) */
        .card-front {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 2px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.03);
        }
        /* Style card back (element revealed face) */
        .card-back {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            transform: rotateY(180deg);
            border: 2px solid rgba(99, 102, 241, 0.3);
        }
        /* Smooth backdrop blur panels */
        .glass-panel {
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        /* Pulse border animation for matching pairs */
        @keyframes neon-pulse {
            0%, 100% { border-color: rgba(20, 184, 166, 0.3); box-shadow: 0 0 5px rgba(20, 184, 166, 0.2); }
            50% { border-color: rgba(20, 184, 166, 0.8); box-shadow: 0 0 20px rgba(20, 184, 166, 0.6); }
        }
        .matched-card {
            animation: neon-pulse 1.5s infinite;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 md:p-6 overflow-x-hidden selection:bg-teal-500/30">

    <div class="w-full max-w-4xl mx-auto flex-1 flex flex-col justify-center space-y-6">
        
        <!-- Header Controls Panel -->
        <header class="text-center space-y-2 mt-2">
            <h1 class="text-3xl md:text-5xl font-black bg-gradient-to-r from-teal-400 via-indigo-300 to-rose-400 bg-clip-text text-transparent tracking-wide">
                بوابة العناصر الأسطورية
            </h1>
            <p class="text-xs md:text-sm text-slate-400 font-medium">اكتشف أزواج العناصر المخفية المتطابقة قبل انتهاء الوقت المخصص!</p>
        </header>

        <!-- Dashboard Scoreboards & Indicators (Glassmorphism) -->
        <section class="glass-panel rounded-3xl p-4 md:p-6 shadow-2xl relative overflow-hidden">
            
            <!-- Difficulty Selector and Options -->
            <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-4 mb-4">
                <div class="flex items-center gap-2">
                    <span class="text-xs text-slate-400 font-bold">مستوى اللعب:</span>
                    <div class="flex bg-slate-950/80 p-1 rounded-xl border border-slate-800">
                        <button onclick="changeDifficulty('easy')" id="btn-diff-easy" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all duration-200">سهل</button>
                        <button onclick="changeDifficulty('medium')" id="btn-diff-medium" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all duration-200">متوسط</button>
                        <button onclick="changeDifficulty('hard')" id="btn-diff-hard" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all duration-200">صعب</button>
                    </div>
                </div>

                <!-- Web Audio Control toggle -->
                <button onclick="toggleAudio()" id="btn-sound-toggle" class="flex items-center gap-2 px-3 py-1.5 bg-slate-800/60 hover:bg-slate-700/80 border border-slate-700/50 rounded-xl text-xs font-bold transition-all">
                    <span id="sound-icon" class="text-base">🔊</span>
                    <span id="sound-text">الأصوات مفعّلة</span>
                </button>
            </div>

            <!-- Stats grid layout -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-center">
                <!-- Countdown Timer -->
                <div class="bg-slate-950/40 border border-slate-800 rounded-2xl p-3 relative overflow-hidden">
                    <span class="text-[10px] text-slate-400 font-bold block mb-1">الوقت المتبقي</span>
                    <span id="timer-label" class="text-2xl font-black text-teal-400 neon-glow-teal tracking-widest">00:00</span>
                    <!-- Progress line underlay -->
                    <div class="absolute bottom-0 left-0 h-1 bg-gradient-to-r from-teal-500 to-emerald-400 transition-all duration-1000" id="timer-progress" style="width: 100%;"></div>
                </div>

                <!-- Matches Ratio -->
                <div class="bg-slate-950/40 border border-slate-800 rounded-2xl p-3">
                    <span class="text-[10px] text-slate-400 font-bold block mb-1">التطابقات المكتملة</span>
                    <span id="match-label" class="text-2xl font-black text-indigo-300">0 / 0</span>
                </div>

                <!-- Moves count -->
                <div class="bg-slate-950/40 border border-slate-800 rounded-2xl p-3">
                    <span class="text-[10px] text-slate-400 font-bold block mb-1">النقرات والحركات</span>
                    <span id="moves-label" class="text-2xl font-black text-slate-100">0</span>
                </div>

                <!-- Best Score record tracker -->
                <div class="bg-slate-950/40 border border-slate-800 rounded-2xl p-3">
                    <span class="text-[10px] text-slate-400 font-bold block mb-1">أفضل رقم قياسي</span>
                    <span id="best-record-label" class="text-xs font-black text-amber-400 block mt-2">لا يوجد سجل</span>
                </div>
            </div>
        </section>

        <!-- Responsive Interactive Memory Game Board -->
        <main class="relative">
            <!-- Overlay Notification Panel for Victory/Defeat -->
            <div id="overlay-status" class="absolute inset-0 bg-slate-950/95 rounded-[2.5rem] z-30 flex flex-col items-center justify-center space-y-6 scale-0 opacity-0 transition-all duration-300 backdrop-blur-md border border-slate-800/80 p-6 text-center">
                <div id="status-icon" class="w-20 h-20 rounded-full flex items-center justify-center bg-slate-900 shadow-xl text-4xl animate-bounce"></div>
                <div class="space-y-2">
                    <h2 id="status-headline" class="text-2xl md:text-3xl font-black text-white"></h2>
                    <p id="status-subtext" class="text-xs md:text-sm text-slate-400 max-w-sm mx-auto leading-relaxed"></p>
                </div>
                <!-- Interactive dynamic summary of match -->
                <div class="grid grid-cols-2 gap-4 bg-slate-900/50 p-4 rounded-2xl border border-slate-800 text-sm">
                    <div>
                        <span class="text-xs text-slate-400 block mb-1">الوقت المستغرق:</span>
                        <span id="summary-time" class="font-bold text-white">--</span>
                    </div>
                    <div>
                        <span class="text-xs text-slate-400 block mb-1">إجمالي الحركات:</span>
                        <span id="summary-moves" class="font-bold text-white">--</span>
                    </div>
                </div>
                <!-- Try again button -->
                <button onclick="startGame()" class="bg-gradient-to-r from-teal-500 to-indigo-500 hover:from-teal-400 hover:to-indigo-400 text-slate-950 font-black text-sm px-8 py-3.5 rounded-2xl shadow-lg shadow-teal-500/20 hover:scale-105 active:scale-95 transition-all">
                    ابدأ تحدياً جديداً
                </button>
            </div>

            <!-- Memory Grid -->
            <div id="cards-grid" class="grid gap-3 md:gap-4 bg-slate-950/50 p-4 rounded-[2.5rem] border border-slate-800/80 shadow-2xl justify-center items-center min-h-[320px]">
                <!-- Cards will be generated dynamically by JavaScript -->
            </div>
        </main>

        <!-- Footer actions & settings resets -->
        <footer class="flex flex-col sm:flex-row items-center justify-between gap-3 pb-4">
            <!-- Reset Leaderboard/Best Score -->
            <button onclick="clearLeaderboard()" class="w-full sm:w-auto py-3 px-5 rounded-2xl text-xs font-bold bg-slate-950 hover:bg-slate-900 text-rose-400 border border-rose-500/10 hover:border-rose-500/30 transition-all flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-4v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                تصفير السجلات التاريخية
            </button>
            
            <!-- Restart current level -->
            <button onclick="startGame()" class="w-full sm:w-auto py-3 px-8 rounded-2xl text-xs font-black bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-slate-600 transition-all text-slate-200">
                إعادة تشغيل الجولة الحالية
            </button>
        </footer>

    </div>

    <!-- Javascript Game Mechanics Engine -->
    <script>
        // Core Web Audio API Sound Synthesizer
        let audioContext = null;
        let isAudioMuted = false;

        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        // Custom Synthesizer notes for responsive gaming feedbacks
        function playSynthSound(type) {
            if (isAudioMuted) return;
            try {
                initAudioContext();
                const ctx = audioContext;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                const now = ctx.currentTime;

                if (type === 'flip') {
                    // Quick futuristic bleep
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(350, now);
                    osc.frequency.exponentialRampToValueAtTime(700, now + 0.12);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'match') {
                    // Harmonious dual note chord
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                    osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.25); // C6
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'fail') {
                    // Descending heavy synth buzz
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(160, now);
                    osc.frequency.linearRampToValueAtTime(90, now + 0.25);
                    gain.gain.setValueAtTime(0.06, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'win') {
                    // Happy upbeat triumphant melody
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const noteOsc = ctx.createOscillator();
                        const noteGain = ctx.createGain();
                        noteOsc.connect(noteGain);
                        noteGain.connect(ctx.destination);
                        
                        noteOsc.type = 'triangle';
                        noteOsc.frequency.setValueAtTime(freq, now + (idx * 0.1));
                        noteGain.gain.setValueAtTime(0.08, now + (idx * 0.1));
                        noteGain.gain.linearRampToValueAtTime(0.001, now + (idx * 0.1) + 0.3);
                        noteOsc.start(now + (idx * 0.1));
                        noteOsc.stop(now + (idx * 0.1) + 0.3);
                    });
                } else if (type === 'lose') {
                    // Melancholic descending notes
                    const notes = [392.00, 349.23, 311.13, 261.63];
                    notes.forEach((freq, idx) => {
                        const noteOsc = ctx.createOscillator();
                        const noteGain = ctx.createGain();
                        noteOsc.connect(noteGain);
                        noteGain.connect(ctx.destination);
                        
                        noteOsc.type = 'sawtooth';
                        noteOsc.frequency.setValueAtTime(freq, now + (idx * 0.12));
                        noteGain.gain.setValueAtTime(0.06, now + (idx * 0.12));
                        noteGain.gain.linearRampToValueAtTime(0.001, now + (idx * 0.12) + 0.4);
                        noteOsc.start(now + (idx * 0.12));
                        noteOsc.stop(now + (idx * 0.12) + 0.4);
                    });
                } else if (type === 'tick') {
                    // Small ticking sound
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1200, now);
                    gain.gain.setValueAtTime(0.02, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                }
            } catch (err) {
                console.warn('Audio synthesis issue:', err);
            }
        }

        function toggleAudio() {
            isAudioMuted = !isAudioMuted;
            const btnSoundText = document.getElementById('sound-text');
            const btnSoundIcon = document.getElementById('sound-icon');
            
            if (isAudioMuted) {
                btnSoundText.textContent = "الأصوات مكتومة";
                btnSoundIcon.textContent = "🔇";
            } else {
                btnSoundText.textContent = "الأصوات مفعّلة";
                btnSoundIcon.textContent = "🔊";
                initAudioContext();
                playSynthSound('flip');
            }
        }

        // Element pool: Distinct glowing element/mystic emojis
        const elementPool = [
            '🔮', '💎', '🌟', '🔥', '💧', '⚡', '🌀', '🍀', 
            '🔑', '👑', '🌈', '🪐', '⚓', '🔔', '🎭', '🛡️', 
            '🍎', '🚀', '🛸', '🎯', '🎈', '🔋'
        ];

        // Difficulty Settings Configuration
        const diffConfigs = {
            easy: { cols: 4, rows: 4, limitTime: 45, pairsCount: 8, gridClass: "grid-cols-4 max-w-[420px]" },
            medium: { cols: 6, rows: 4, limitTime: 75, pairsCount: 12, gridClass: "grid-cols-4 md:grid-cols-6 max-w-[620px]" },
            hard: { cols: 6, rows: 6, limitTime: 120, pairsCount: 18, gridClass: "grid-cols-6 max-w-[620px]" }
        };

        // Active States
        let activeDifficulty = 'easy';
        let cardList = [];
        let flippedCardIndices = [];
        let moveCounter = 0;
        let solvedCount = 0;
        let secondsLeft = 0;
        let timerInterval = null;
        let gameActive = false;
        let preventFlipping = false;

        // Display Scoreboard Elements
        const gridContainer = document.getElementById('cards-grid');
        const timerLabel = document.getElementById('timer-label');
        const progressLine = document.getElementById('timer-progress');
        const matchLabel = document.getElementById('match-label');
        const movesLabel = document.getElementById('moves-label');
        const bestLabel = document.getElementById('best-record-label');

        const statusOverlay = document.getElementById('overlay-status');
        const statusIcon = document.getElementById('status-icon');
        const statusHeadline = document.getElementById('status-headline');
        const statusSubtext = document.getElementById('status-subtext');
        const summaryTime = document.getElementById('summary-time');
        const summaryMoves = document.getElementById('summary-moves');

        // Setup initial UI states
        function changeDifficulty(diff) {
            if (preventFlipping) return;
            activeDifficulty = diff;
            
            // Toggle difficulty selection buttons visually
            const difficulties = ['easy', 'medium', 'hard'];
            difficulties.forEach(d => {
                const btn = document.getElementById(`btn-diff-${d}`);
                if (d === diff) {
                    btn.className = "px-3 py-1.5 rounded-lg text-xs font-black bg-gradient-to-r from-teal-500 to-indigo-500 text-slate-950 shadow-md shadow-teal-500/10";
                } else {
                    btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold text-slate-400 hover:text-slate-100";
                }
            });

            loadBestScoreRecord();
            startGame();
        }

        // Save and Load best scores records with LocalStorage
        function getBestScoreKey() {
            return `eg_mem_best_${activeDifficulty}`;
        }

        function loadBestScoreRecord() {
            const rawData = localStorage.getItem(getBestScoreKey());
            if (rawData) {
                const record = JSON.parse(rawData);
                bestLabel.innerHTML = `🏆 ${record.moves} حركة <span class="mx-1">/</span> ${record.timeLeft}ث متبقية`;
            } else {
                bestLabel.textContent = "لا يوجد سجل";
            }
        }

        function clearLeaderboard() {
            if (confirm("هل أنت متأكد من رغبتك في مسح أفضل الأرقام القياسية المسجلة لهذا المستوى؟")) {
                localStorage.removeItem(getBestScoreKey());
                loadBestScoreRecord();
                playSynthSound('fail');
            }
        }

        // Construct memory deck and assemble gameboard elements
        function startGame() {
            // Cancel any pending countdowns
            clearInterval(timerInterval);
            
            const config = diffConfigs[activeDifficulty];
            secondsLeft = config.limitTime;
            moveCounter = 0;
            solvedCount = 0;
            flippedCardIndices = [];
            preventFlipping = false;
            gameActive = true;

            // Sync scoreboard DOM texts
            movesLabel.textContent = moveCounter;
            matchLabel.textContent = `0 / ${config.pairsCount}`;
            timerLabel.textContent = formatTime(secondsLeft);
            timerLabel.className = "text-2xl font-black text-teal-400 neon-glow-teal tracking-widest";
            progressLine.style.width = "100%";
            progressLine.className = "absolute bottom-0 left-0 h-1 bg-gradient-to-r from-teal-500 to-emerald-400 transition-all duration-1000";

            // Remove game status overlay safely
            statusOverlay.classList.remove('scale-100', 'opacity-100');
            statusOverlay.classList.add('scale-0', 'opacity-0');

            // Pick elements from pool and duplicate to create matching deck
            const pickedElements = elementPool.slice(0, config.pairsCount);
            const deck = [...pickedElements, ...pickedElements];
            
            // Shuffle using Fisher-Yates algorithm
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }

            // Create Memory card objects
            cardList = deck.map((elemValue, idx) => ({
                id: idx,
                value: elemValue,
                isFlipped: false,
                isMatched: false
            }));

            // Re-render Gameboard grid dynamically
            gridContainer.className = `grid gap-3 md:gap-4 bg-slate-950/50 p-4 rounded-[2.5rem] border border-slate-800/80 shadow-2xl justify-center items-center min-h-[320px] ${config.gridClass}`;
            gridContainer.innerHTML = '';

            cardList.forEach((card, idx) => {
                const cardEl = document.createElement('div');
                cardEl.className = "card-container aspect-square w-16 h-16 md:w-20 md:h-20 cursor-pointer select-none";
                cardEl.id = `card-${idx}`;
                cardEl.setAttribute('onclick', `cardClicked(${idx})`);

                cardEl.innerHTML = `
                    <div class="card-inner w-full h-full">
                        <!-- Front Face of Card -->
                        <div class="card-front flex items-center justify-center transition-all-300 hover:border-indigo-500/50 hover:shadow-lg hover:shadow-indigo-500/10">
                            <span class="text-xl md:text-2xl text-indigo-400/30 font-black">?</span>
                        </div>
                        <!-- Back Face of Card -->
                        <div class="card-back flex items-center justify-center shadow-2xl">
                            <span class="text-2xl md:text-3.5xl">${card.value}</span>
                        </div>
                    </div>
                `;
                gridContainer.appendChild(cardEl);
            });

            // Start ticking clock countdown
            startTimerCountdown();
            loadBestScoreRecord();
        }

        // Timer controller logic
        function startTimerCountdown() {
            const config = diffConfigs[activeDifficulty];
            const maxDuration = config.limitTime;

            timerInterval = setInterval(() => {
                if (!gameActive) return;
                secondsLeft--;

                timerLabel.textContent = formatTime(secondsLeft);
                
                // Adjust ticking progress line visually
                const progressPercentage = (secondsLeft / maxDuration) * 100;
                progressLine.style.width = `${progressPercentage}%`;

                // Give sound notifications and color updates when time is low
                if (secondsLeft <= 10 && secondsLeft > 0) {
                    playSynthSound('tick');
                    timerLabel.className = "text-2xl font-black text-rose-500 neon-glow-rose tracking-widest animate-pulse";
                    progressLine.className = "absolute bottom-0 left-0 h-1 bg-gradient-to-r from-rose-500 to-rose-700 transition-all duration-1000";
                }

                if (secondsLeft <= 0) {
                    clearInterval(timerInterval);
                    timerLabel.textContent = "00:00";
                    endGameMaster(false);
                }
            }, 1000);
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        // Card Click Handler Logic
        function cardClicked(idx) {
            // Ignore clicking matched, already flipped cards, or when interactive block is active
            if (!gameActive || preventFlipping || cardList[idx].isFlipped || cardList[idx].isMatched) return;

            initAudioContext(); // Pre-initialize audio contexts for modern browser click policies

            // Flip Card Visually
            const cardEl = document.getElementById(`card-${idx}`);
            cardEl.classList.add('is-flipped');
            cardList[idx].isFlipped = true;
            playSynthSound('flip');

            flippedCardIndices.push(idx);

            // Once two cards are flipped, perform matching verification checks
            if (flippedCardIndices.length === 2) {
                moveCounter++;
                movesLabel.textContent = moveCounter;
                preventFlipping = true;
                
                setTimeout(evaluateFlippedCards, 600);
            }
        }

        // Matching pair evaluations
        function evaluateFlippedCards() {
            const [firstIdx, secondIdx] = flippedCardIndices;
            const firstCard = cardList[firstIdx];
            const secondCard = cardList[secondIdx];

            const firstEl = document.getElementById(`card-${firstIdx}`);
            const secondEl = document.getElementById(`card-${secondIdx}`);

            if (firstCard.value === secondCard.value) {
                // MATCH SUCCESSFUL!
                firstCard.isMatched = true;
                secondCard.isMatched = true;
                
                // Add success visual feedback styles
                firstEl.querySelector('.card-back').classList.add('matched-card');
                secondEl.querySelector('.card-back').classList.add('matched-card');

                playSynthSound('match');
                solvedCount++;
                
                const config = diffConfigs[activeDifficulty];
                matchLabel.textContent = `${solvedCount} / ${config.pairsCount}`;

                // Check for overall level victory
                if (solvedCount === config.pairsCount) {
                    clearInterval(timerInterval);
                    endGameMaster(true);
                }
            } else {
                // MATCH FAILED!
                playSynthSound('fail');
                
                // Bounce un-match indicator glow
                firstEl.classList.add('animate-shake');
                secondEl.classList.add('animate-shake');

                setTimeout(() => {
                    // Turn cards back down
                    firstEl.classList.remove('is-flipped', 'animate-shake');
                    secondEl.classList.remove('is-flipped', 'animate-shake');
                    
                    firstCard.isFlipped = false;
                    secondCard.isFlipped = false;
                }, 500);
            }

            // Flush temporary flipped array
            flippedCardIndices = [];
            preventFlipping = false;
        }

        // Handle Game Over states and save/update highscores
        function endGameMaster(isVictory) {
            gameActive = false;
            preventFlipping = true;

            const config = diffConfigs[activeDifficulty];
            const timeElapsed = config.limitTime - secondsLeft;

            if (isVictory) {
                playSynthSound('win');
                statusIcon.textContent = "🏆";
                statusIcon.className = "w-20 h-20 rounded-full flex items-center justify-center bg-teal-500 text-slate-950 shadow-xl shadow-teal-500/20 text-4xl animate-bounce";
                statusHeadline.textContent = "انتصار أسطوري رائع!";
                statusSubtext.textContent = "تهانينا! أنت تملك ذاكرة فوتوغرافية مذهلة وقدرة استيعاب وسرعة بديهة خيالية.";

                summaryTime.textContent = `${timeElapsed} ثانية`;
                summaryMoves.textContent = `${moveCounter} حركة`;

                // Evaluate Best Record Achievements
                evaluateBestScoreRecord(timeElapsed, moveCounter);
            } else {
                playSynthSound('lose');
                statusIcon.textContent = "⌛";
                statusIcon.className = "w-20 h-20 rounded-full flex items-center justify-center bg-rose-500 text-slate-950 shadow-xl shadow-rose-500/20 text-4xl animate-pulse";
                statusHeadline.textContent = "انتهى الوقت المتاح!";
                statusSubtext.textContent = "لا تقلق! التدريب المستمر يبني ذاكرة أقوى. اضغط على الزر بالأسفل وحاول مجدداً.";

                summaryTime.textContent = `انتهى الوقت`;
                summaryMoves.textContent = `${moveCounter} حركة`;
            }

            // Smooth reveal overlay results cards
            setTimeout(() => {
                statusOverlay.classList.remove('scale-0', 'opacity-0');
                statusOverlay.classList.add('scale-100', 'opacity-100');
            }, 800);
        }

        // Determine if current game stats break historical best records
        function evaluateBestScoreRecord(timeElapsed, movesCount) {
            const key = getBestScoreKey();
            const rawData = localStorage.getItem(key);
            const scoreObj = { moves: movesCount, timeUsed: timeElapsed, timeLeft: secondsLeft };

            if (!rawData) {
                // No records yet, write first
                localStorage.setItem(key, JSON.stringify(scoreObj));
            } else {
                const currentBest = JSON.parse(rawData);
                // Criteria: Better score means less moves. If same moves, then more time left.
                if (movesCount < currentBest.moves || (movesCount === currentBest.moves && secondsLeft > currentBest.timeLeft)) {
                    localStorage.setItem(key, JSON.stringify(scoreObj));
                }
            }
            loadBestScoreRecord();
        }

        // Boot-Up App
        window.addEventListener('DOMContentLoaded', () => {
            changeDifficulty('easy');
        });
    </script>
</body>
</html>
