<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المعزف الإيقاعي الاحترافي - Cyber Drum Kit</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cairo Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-emerald: #10b981;
            --neon-rose: #f43f5e;
            --neon-amber: #f59e0b;
            --neon-indigo: #6366f1;
            --neon-cyan: #06b6d4;
            --neon-fuchsia: #d946ef;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at center, #0b0f19 0%, #030712 100%);
        }

        /* Glassmorphism panel base */
        .glass-panel {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* Drum pad scaling and individual glowing transitions */
        .drum-pad {
            transition: transform 0.08s ease, box-shadow 0.08s ease, border-color 0.08s ease, background-color 0.08s ease;
            transform-style: preserve-3d;
            perspective: 500px;
        }

        /* Trigger active state styles per instrument colors */
        .drum-pad.active-emerald {
            transform: scale(0.95) translateY(2px);
            background-color: rgba(16, 185, 129, 0.15);
            border-color: var(--neon-emerald);
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.4);
        }

        .drum-pad.active-rose {
            transform: scale(0.95) translateY(2px);
            background-color: rgba(244, 63, 94, 0.15);
            border-color: var(--neon-rose);
            box-shadow: 0 0 25px rgba(244, 63, 94, 0.4);
        }

        .drum-pad.active-amber {
            transform: scale(0.95) translateY(2px);
            background-color: rgba(245, 158, 11, 0.15);
            border-color: var(--neon-amber);
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.4);
        }

        .drum-pad.active-indigo {
            transform: scale(0.95) translateY(2px);
            background-color: rgba(99, 102, 241, 0.15);
            border-color: var(--neon-indigo);
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.4);
        }

        .drum-pad.active-cyan {
            transform: scale(0.95) translateY(2px);
            background-color: rgba(6, 182, 212, 0.15);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.4);
        }

        .drum-pad.active-fuchsia {
            transform: scale(0.95) translateY(2px);
            background-color: rgba(217, 70, 239, 0.15);
            border-color: var(--neon-fuchsia);
            box-shadow: 0 0 25px rgba(217, 70, 239, 0.4);
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 md:p-8 overflow-x-hidden selection:bg-cyan-500/30">

    <!-- Main Container -->
    <div class="w-full max-w-4xl mx-auto flex-1 flex flex-col justify-center space-y-6">
        
        <!-- Header -->
        <header class="text-center space-y-2">
            <h1 class="text-3xl md:text-5xl font-black bg-gradient-to-r from-cyan-400 via-fuchsia-400 to-amber-400 bg-clip-text text-transparent tracking-wide">
                المعزف الإيقاعي السيبراني
            </h1>
            <p class="text-xs md:text-sm text-slate-400 font-medium">انقر على الأزرار أو اضغط على أحرف الكيبورد المقابلة لإنشاء أعنف الإيقاعات!</p>
        </header>

        <!-- Dynamic Visualization Dashboard -->
        <div class="glass-panel rounded-[2rem] p-4 shadow-2xl relative overflow-hidden border border-slate-800">
            <!-- Audio Spectrum Canvas Analyzer -->
            <canvas id="visualizer" class="w-full h-24 md:h-32 rounded-2xl bg-slate-950/40 border border-slate-800/50"></canvas>
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-20">
                <span class="text-xs font-bold tracking-widest text-cyan-400">محلل الترددات الفوري - AUDIO ANALYZER</span>
            </div>
        </div>

        <!-- Master Sequencer & Controls -->
        <div class="glass-panel rounded-2xl p-4 flex flex-wrap items-center justify-between gap-4 border border-slate-800/60">
            <div class="flex items-center gap-3">
                <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-xs font-bold text-slate-300">مستوى الاستجابة: فوري (0ms Latency)</span>
            </div>

            <div class="flex items-center gap-2">
                <!-- Auto Loop Sequencer Play Button -->
                <button id="btn-demo" onclick="toggleDemoSequence()" class="bg-gradient-to-r from-cyan-500 to-indigo-500 hover:from-cyan-400 hover:to-indigo-400 text-slate-950 font-black text-xs py-2 px-5 rounded-xl transition-all shadow-md shadow-cyan-500/10 flex items-center gap-2">
                    <svg id="demo-icon" class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/></svg>
                    تشغيل إيقاع تلقائي (Demo)
                </button>
                
                <!-- Volume Control -->
                <div class="flex items-center gap-2 bg-slate-900/60 border border-slate-800 px-3 py-1.5 rounded-xl">
                    <span class="text-[10px] font-bold text-slate-400">الصوت:</span>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.7" oninput="updateMasterVolume(this.value)" class="w-16 h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-cyan-400">
                </div>
            </div>
        </div>

        <!-- Drum Kit Pads Grid -->
        <div class="grid grid-cols-3 gap-4 md:gap-6">
            
            <!-- Pad A - Kick -->
            <button id="pad-A" onclick="triggerPad('A')" class="drum-pad glass-panel border-2 border-slate-800 hover:border-emerald-500/30 rounded-[2rem] p-5 md:p-8 flex flex-col items-center justify-between aspect-square relative overflow-hidden group">
                <div class="absolute top-3 left-3 w-2 h-2 rounded-full bg-emerald-500 shadow-lg shadow-emerald-500/50"></div>
                <span class="text-2xl md:text-3xl font-black text-emerald-400 group-hover:scale-110 transition-transform">Kick</span>
                <div class="flex flex-col items-center gap-1">
                    <span class="text-[10px] md:text-xs text-slate-500 font-bold">ركلة الباس</span>
                    <kbd class="px-2 py-1 rounded bg-slate-800 border border-slate-700 text-xs text-emerald-400 font-mono font-black">A</kbd>
                </div>
            </button>

            <!-- Pad S - Snare -->
            <button id="pad-S" onclick="triggerPad('S')" class="drum-pad glass-panel border-2 border-slate-800 hover:border-rose-500/30 rounded-[2rem] p-5 md:p-8 flex flex-col items-center justify-between aspect-square relative overflow-hidden group">
                <div class="absolute top-3 left-3 w-2 h-2 rounded-full bg-rose-500 shadow-lg shadow-rose-500/50"></div>
                <span class="text-2xl md:text-3xl font-black text-rose-400 group-hover:scale-110 transition-transform">Snare</span>
                <div class="flex flex-col items-center gap-1">
                    <span class="text-[10px] md:text-xs text-slate-500 font-bold">طبل سنير</span>
                    <kbd class="px-2 py-1 rounded bg-slate-800 border border-slate-700 text-xs text-rose-400 font-mono font-black">S</kbd>
                </div>
            </button>

            <!-- Pad D - HiHat Closed -->
            <button id="pad-D" onclick="triggerPad('D')" class="drum-pad glass-panel border-2 border-slate-800 hover:border-amber-500/30 rounded-[2rem] p-5 md:p-8 flex flex-col items-center justify-between aspect-square relative overflow-hidden group">
                <div class="absolute top-3 left-3 w-2 h-2 rounded-full bg-amber-500 shadow-lg shadow-amber-500/50"></div>
                <span class="text-2xl md:text-3xl font-black text-amber-400 group-hover:scale-110 transition-transform">Hat (C)</span>
                <div class="flex flex-col items-center gap-1">
                    <span class="text-[10px] md:text-xs text-slate-500 font-bold">هاي-هات مغلق</span>
                    <kbd class="px-2 py-1 rounded bg-slate-800 border border-slate-700 text-xs text-amber-400 font-mono font-black">D</kbd>
                </div>
            </button>

            <!-- Pad F - HiHat Open -->
            <button id="pad-F" onclick="triggerPad('F')" class="drum-pad glass-panel border-2 border-slate-800 hover:border-amber-500/30 rounded-[2rem] p-5 md:p-8 flex flex-col items-center justify-between aspect-square relative overflow-hidden group">
                <div class="absolute top-3 left-3 w-2 h-2 rounded-full bg-amber-400 shadow-lg shadow-amber-400/50"></div>
                <span class="text-2xl md:text-3xl font-black text-amber-300 group-hover:scale-110 transition-transform">Hat (O)</span>
                <div class="flex flex-col items-center gap-1">
                    <span class="text-[10px] md:text-xs text-slate-500 font-bold">هاي-هات مفتوح</span>
                    <kbd class="px-2 py-1 rounded bg-slate-800 border border-slate-700 text-xs text-amber-300 font-mono font-black">F</kbd>
                </div>
            </button>

            <!-- Pad G - Low Tom -->
            <button id="pad-G" onclick="triggerPad('G')" class="drum-pad glass-panel border-2 border-slate-800 hover:border-indigo-500/30 rounded-[2rem] p-5 md:p-8 flex flex-col items-center justify-between aspect-square relative overflow-hidden group">
                <div class="absolute top-3 left-3 w-2 h-2 rounded-full bg-indigo-500 shadow-lg shadow-indigo-500/50"></div>
                <span class="text-2xl md:text-3xl font-black text-indigo-400 group-hover:scale-110 transition-transform">Low Tom</span>
                <div class="flex flex-col items-center gap-1">
                    <span class="text-[10px] md:text-xs text-slate-500 font-bold">توم منخفض</span>
                    <kbd class="px-2 py-1 rounded bg-slate-800 border border-slate-700 text-xs text-indigo-400 font-mono font-black">G</kbd>
                </div>
            </button>

            <!-- Pad H - High Tom -->
            <button id="pad-H" onclick="triggerPad('H')" class="drum-pad glass-panel border-2 border-slate-800 hover:border-indigo-500/30 rounded-[2rem] p-5 md:p-8 flex flex-col items-center justify-between aspect-square relative overflow-hidden group">
                <div class="absolute top-3 left-3 w-2 h-2 rounded-full bg-violet-500 shadow-lg shadow-violet-500/50"></div>
                <span class="text-2xl md:text-3xl font-black text-violet-400 group-hover:scale-110 transition-transform">High Tom</span>
                <div class="flex flex-col items-center gap-1">
                    <span class="text-[10px] md:text-xs text-slate-500 font-bold">توم مرتفع</span>
                    <kbd class="px-2 py-1 rounded bg-slate-800 border border-slate-700 text-xs text-violet-400 font-mono font-black">H</kbd>
                </div>
            </button>

            <!-- Pad J - Crash Cymbal -->
            <button id="pad-J" onclick="triggerPad('J')" class="drum-pad glass-panel border-2 border-slate-800 hover:border-cyan-500/30 rounded-[2rem] p-5 md:p-8 flex flex-col items-center justify-between aspect-square relative overflow-hidden group">
                <div class="absolute top-3 left-3 w-2 h-2 rounded-full bg-cyan-500 shadow-lg shadow-cyan-500/50"></div>
                <span class="text-2xl md:text-3xl font-black text-cyan-400 group-hover:scale-110 transition-transform">Crash</span>
                <div class="flex flex-col items-center gap-1">
                    <span class="text-[10px] md:text-xs text-slate-500 font-bold">صنج كراش</span>
                    <kbd class="px-2 py-1 rounded bg-slate-800 border border-slate-700 text-xs text-cyan-400 font-mono font-black">J</kbd>
                </div>
            </button>

            <!-- Pad K - Hand Clap -->
            <button id="pad-K" onclick="triggerPad('K')" class="drum-pad glass-panel border-2 border-slate-800 hover:border-fuchsia-500/30 rounded-[2rem] p-5 md:p-8 flex flex-col items-center justify-between aspect-square relative overflow-hidden group">
                <div class="absolute top-3 left-3 w-2 h-2 rounded-full bg-fuchsia-500 shadow-lg shadow-fuchsia-500/50"></div>
                <span class="text-2xl md:text-3xl font-black text-fuchsia-400 group-hover:scale-110 transition-transform">Clap</span>
                <div class="flex flex-col items-center gap-1">
                    <span class="text-[10px] md:text-xs text-slate-500 font-bold">تصفيق يدوي</span>
                    <kbd class="px-2 py-1 rounded bg-slate-800 border border-slate-700 text-xs text-fuchsia-400 font-mono font-black">K</kbd>
                </div>
            </button>

            <!-- Pad L - Cowbell -->
            <button id="pad-L" onclick="triggerPad('L')" class="drum-pad glass-panel border-2 border-slate-800 hover:border-amber-500/30 rounded-[2rem] p-5 md:p-8 flex flex-col items-center justify-between aspect-square relative overflow-hidden group">
                <div class="absolute top-3 left-3 w-2 h-2 rounded-full bg-amber-500 shadow-lg shadow-amber-500/50"></div>
                <span class="text-2xl md:text-3xl font-black text-amber-500 group-hover:scale-110 transition-transform">Cowbell</span>
                <div class="flex flex-col items-center gap-1">
                    <span class="text-[10px] md:text-xs text-slate-500 font-bold">جرس معدني</span>
                    <kbd class="px-2 py-1 rounded bg-slate-800 border border-slate-700 text-xs text-amber-500 font-mono font-black">L</kbd>
                </div>
            </button>

        </div>

        <!-- System Status Footer -->
        <footer class="text-center py-4 text-xs text-slate-600">
            برمجة محرك الصوتيات نقيّة بالكامل مع معالج Web Audio API Synth • صُنع بكل شغف
        </footer>

    </div>

    <!-- Gameplay & Audio Synthesis Script Engine -->
    <script>
        // Dictionary for mapping visual keys
        const padConfig = {
            'A': { activeClass: 'active-emerald', synth: playKick },
            'S': { activeClass: 'active-rose', synth: playSnare },
            'D': { activeClass: 'active-amber', synth: playClosedHat },
            'F': { activeClass: 'active-amber', synth: playOpenHat },
            'G': { activeClass: 'active-indigo', synth: playLowTom },
            'H': { activeClass: 'active-indigo', synth: playHighTom },
            'J': { activeClass: 'active-cyan', synth: playCrash },
            'K': { activeClass: 'active-fuchsia', synth: playClap },
            'L': { activeClass: 'active-amber', synth: playCowbell }
        };

        let audioCtx = null;
        let masterGain = null;
        let analyser = null;
        let noiseBuffer = null;
        let demoInterval = null;
        let isDemoPlaying = false;
        let masterVolume = 0.7;

        // Initialize Web Audio Engine
        function initAudioEngine() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // Set up visualizer nodes
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 128;
                
                masterGain = audioCtx.createGain();
                masterGain.gain.setValueAtTime(masterVolume, audioCtx.currentTime);

                // Connection tree: Sound -> MasterGain -> Analyser -> Output
                masterGain.connect(analyser);
                analyser.connect(audioCtx.destination);

                // Pre-render white noise buffer to optimize memory/speed
                generateNoiseBuffer();
                startVisualizerAnimation();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Noise buffer renderer for Snare, Hats, and Cymbals
        function generateNoiseBuffer() {
            const bufferSize = audioCtx.sampleRate * 2; // 2 seconds
            noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }
        }

        // --- SYNTHESIZER VOICES GENERATION ---

        // Kick / Bass Drum
        function playKick(time) {
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.connect(gainNode);
            gainNode.connect(masterGain);

            osc.type = 'sine';
            // Sweep frequency from 150Hz to 0.01Hz rapidly to emulate deep pressure thump
            osc.frequency.setValueAtTime(150, time);
            osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.15);

            gainNode.gain.setValueAtTime(1.0, time);
            gainNode.gain.exponentialRampToValueAtTime(0.001, time + 0.15);

            osc.start(time);
            osc.stop(time + 0.16);
        }

        // Snare Drum
        function playSnare(time) {
            // Snare combines a metallic low frequency tone with high frequency white noise
            const osc = audioCtx.createOscillator();
            const oscGain = audioCtx.createGain();
            osc.connect(oscGain);
            oscGain.connect(masterGain);

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(180, time);
            oscGain.gain.setValueAtTime(0.5, time);
            oscGain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);

            osc.start(time);
            osc.stop(time + 0.11);

            // Noise component
            const noise = audioCtx.createBufferSource();
            noise.buffer = noiseBuffer;

            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'highpass';
            noiseFilter.frequency.setValueAtTime(1000, time);

            const noiseGain = audioCtx.createGain();
            
            noise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(masterGain);

            noiseGain.gain.setValueAtTime(1.0, time);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, time + 0.15);

            noise.start(time);
            noise.stop(time + 0.16);
        }

        // Closed Hi-Hat
        function playClosedHat(time) {
            const noise = audioCtx.createBufferSource();
            noise.buffer = noiseBuffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(10000, time);

            const gainNode = audioCtx.createGain();

            noise.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(masterGain);

            gainNode.gain.setValueAtTime(0.4, time);
            gainNode.gain.exponentialRampToValueAtTime(0.01, time + 0.05); // Very fast decay

            noise.start(time);
            noise.stop(time + 0.06);
        }

        // Open Hi-Hat
        function playOpenHat(time) {
            const noise = audioCtx.createBufferSource();
            noise.buffer = noiseBuffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(8000, time);

            const gainNode = audioCtx.createGain();

            noise.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(masterGain);

            gainNode.gain.setValueAtTime(0.35, time);
            gainNode.gain.exponentialRampToValueAtTime(0.01, time + 0.35); // Longer decay

            noise.start(time);
            noise.stop(time + 0.36);
        }

        // Toms (Low and High)
        function playTom(time, baseFreq) {
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.connect(gainNode);
            gainNode.connect(masterGain);

            osc.type = 'sine';
            osc.frequency.setValueAtTime(baseFreq, time);
            osc.frequency.exponentialRampToValueAtTime(baseFreq / 2.2, time + 0.25);

            gainNode.gain.setValueAtTime(1.0, time);
            gainNode.gain.exponentialRampToValueAtTime(0.001, time + 0.25);

            osc.start(time);
            osc.stop(time + 0.26);
        }

        function playLowTom(time) {
            playTom(time, 150);
        }

        function playHighTom(time) {
            playTom(time, 240);
        }

        // Crash Cymbal
        function playCrash(time) {
            const noise = audioCtx.createBufferSource();
            noise.buffer = noiseBuffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(6500, time);

            const gainNode = audioCtx.createGain();

            noise.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(masterGain);

            gainNode.gain.setValueAtTime(0.5, time);
            gainNode.gain.exponentialRampToValueAtTime(0.01, time + 1.2); // Long tail cymbal ring

            noise.start(time);
            noise.stop(time + 1.21);
        }

        // Hand Clap
        function playClap(time) {
            // Claps consist of multiple tightly packed initial noise bursts followed by a decay
            const duration = 0.08;
            const bursts = 3;
            
            for (let i = 0; i < bursts; i++) {
                const burstTime = time + (i * 0.012);
                const noise = audioCtx.createBufferSource();
                noise.buffer = noiseBuffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(1500, burstTime);

                const gainNode = audioCtx.createGain();
                noise.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(masterGain);

                gainNode.gain.setValueAtTime(0.5, burstTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, burstTime + 0.01);

                noise.start(burstTime);
                noise.stop(burstTime + 0.012);
            }

            // Tail sound
            const noiseTail = audioCtx.createBufferSource();
            noiseTail.buffer = noiseBuffer;

            const tailFilter = audioCtx.createBiquadFilter();
            tailFilter.type = 'bandpass';
            tailFilter.frequency.setValueAtTime(1500, time);

            const tailGain = audioCtx.createGain();
            noiseTail.connect(tailFilter);
            tailFilter.connect(tailGain);
            tailGain.connect(masterGain);

            tailGain.gain.setValueAtTime(0.4, time + 0.03);
            tailGain.gain.exponentialRampToValueAtTime(0.01, time + 0.22);

            noiseTail.start(time + 0.03);
            noiseTail.stop(time + 0.23);
        }

        // Cowbell
        function playCowbell(time) {
            // Mixes two square waves at specific frequencies
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc1.type = 'square';
            osc1.frequency.setValueAtTime(540, time);
            
            osc2.type = 'square';
            osc2.frequency.setValueAtTime(800, time);

            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(1000, time);

            osc1.connect(filter);
            osc2.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(masterGain);

            gainNode.gain.setValueAtTime(0.6, time);
            gainNode.gain.exponentialRampToValueAtTime(0.01, time + 0.22);

            osc1.start(time);
            osc2.start(time);
            osc1.stop(time + 0.23);
            osc2.stop(time + 0.23);
        }

        // --- INTERACTIVE ACTIONS & EVENTS ---

        // Triggers visual animations and synth playback
        function triggerPad(keyChar) {
            const config = padConfig[keyChar];
            if (!config) return;

            initAudioEngine();

            const currentTime = audioCtx.currentTime;
            
            // Invoke dynamic audio synthesis node chain instantly
            config.synth(currentTime);

            // UI animation trigger
            const padEl = document.getElementById(`pad-${keyChar}`);
            if (padEl) {
                // Clear any existing active class to ensure overlapping hits re-trigger transition
                padEl.className = padEl.className.replace(/active-\w+/g, '').trim();
                
                // Read from config class
                padEl.classList.add(config.activeClass);
            }
        }

        // Master Volume slider adjustment
        function updateMasterVolume(val) {
            masterVolume = parseFloat(val);
            if (masterGain) {
                masterGain.gain.setValueAtTime(masterVolume, audioCtx.currentTime);
            }
        }

        // Clean active styles smoothly after transition ends
        const allPads = document.querySelectorAll('.drum-pad');
        allPads.forEach(pad => {
            pad.addEventListener('transitionend', (e) => {
                if (e.propertyName !== 'transform') return;
                // Remove any custom active classes
                pad.classList.remove('active-emerald', 'active-rose', 'active-amber', 'active-indigo', 'active-cyan', 'active-fuchsia');
            });
        });

        // Keydown keyboard event listener
        window.addEventListener('keydown', (e) => {
            const key = e.key.toUpperCase();
            if (padConfig[key]) {
                triggerPad(key);
            }
        });

        // Auto Demo Sequencer
        function toggleDemoSequence() {
            initAudioEngine();
            const btn = document.getElementById('btn-demo');
            const icon = document.getElementById('demo-icon');

            if (isDemoPlaying) {
                // Stop Demo
                clearInterval(demoInterval);
                isDemoPlaying = false;
                btn.innerHTML = `
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/></svg>
                    تشغيل إيقاع تلقائي (Demo)
                `;
            } else {
                // Start Demo
                isDemoPlaying = true;
                btn.innerHTML = `
                    <svg class="w-4 h-4 animate-spin text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    إيقاف الإيقاع التلقائي
                `;

                let step = 0;
                const tempoInterval = 140; // ~107 BPM
                
                demoInterval = setInterval(() => {
                    const time = audioCtx.currentTime;
                    
                    // Simple Electronic House Loop Sequencer
                    if (step % 4 === 0) triggerPad('A'); // Kick every 4 steps
                    if (step % 8 === 4) triggerPad('S'); // Snare on backbeat
                    
                    if (step % 2 === 0) {
                        triggerPad('D'); // Closed hat
                    } else {
                        if (step % 4 === 2) triggerPad('F'); // Open Hat accent
                    }

                    if (step === 6 || step === 14) {
                        triggerPad('K'); // Clap embellishment
                    }
                    if (step === 11) {
                        triggerPad('L'); // Cowbell fun accent
                    }

                    step = (step + 1) % 16;
                }, tempoInterval);
            }
        }

        // --- REAL-TIME VISUALIZER ENGINE ---
        function startVisualizerAnimation() {
            const canvas = document.getElementById('visualizer');
            const canvasCtx = canvas.getContext('2d');
            
            // Adjust canvas resolution dynamically
            function resizeCanvas() {
                canvas.width = canvas.clientWidth * window.devicePixelRatio;
                canvas.height = canvas.clientHeight * window.devicePixelRatio;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function draw() {
                requestAnimationFrame(draw);

                analyser.getByteFrequencyData(dataArray);

                canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

                // Drawing wave / columns visualizer
                const barWidth = (canvas.width / bufferLength) * 1.8;
                let barHeight;
                let x = 0;

                for (let i = 0; i < bufferLength; i++) {
                    barHeight = dataArray[i] * 0.7;

                    // Neon cyan-to-fuchsia color scheme gradient
                    const grad = canvasCtx.createLinearGradient(0, canvas.height, 0, canvas.height - barHeight);
                    grad.addColorStop(0, 'rgba(6, 182, 212, 0.1)');
                    grad.addColorStop(0.5, 'rgba(99, 102, 241, 0.6)');
                    grad.addColorStop(1, 'rgba(217, 70, 239, 0.9)');

                    canvasCtx.fillStyle = grad;
                    
                    // Glowing shadow effects for active visualizer column lines
                    canvasCtx.shadowBlur = 4;
                    canvasCtx.shadowColor = '#06b6d4';

                    canvasCtx.fillRect(x, canvas.height - barHeight, barWidth - 4, barHeight);

                    x += barWidth;
                }
            }
            draw();
        }
    </script>
