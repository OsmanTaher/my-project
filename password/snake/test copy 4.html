<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hydro-Grid: Cyber Pipe Puzzle</title>
    <style>
      :root {
        --bg-global: #0b1121;
        --panel-bg: #121b33;
        --border-color: #1e2c4f;
        --neon-blue: #00d2ff;
        --neon-cyan: #00ffff;
        --neon-pink: #ff007f;
        --neon-red: #ff3333;
        --pipe-off: #25355a;
        --pipe-on: #00d2ff;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      body {
        background-color: var(--bg-global);
        color: #ffffff;
        font-family: "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      .game-wrapper {
        display: flex;
        flex-direction: column;
        gap: 20px;
        width: 95vw;
        max-width: 600px;
        padding: 10px;
      }

      /* Header Systems Display Dashboard */
      .dashboard-header {
        background: var(--panel-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
      }

      .control-box {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .control-box .box-label {
        font-size: 0.7rem;
        color: #647fa4;
        letter-spacing: 1px;
        margin-bottom: 4px;
      }

      .control-box .box-value {
        font-size: 1.3rem;
        font-weight: bold;
      }

      /* Viewport & Layout Mechanics */
      .grid-viewport {
        position: relative;
        background: rgba(16, 25, 47, 0.6);
        border: 2px solid var(--border-color);
        border-radius: 16px;
        padding: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5);
      }

      /* Dynamic CSS Grid Pipeline */
      .pipe-grid {
        display: grid;
        gap: 4px;
        width: 100%;
        aspect-ratio: 1 / 1;
        max-width: 420px;
      }

      /* Terminals Source & Dest Nodes Layout */
      .terminal-node {
        position: absolute;
        background: var(--panel-bg);
        border: 1px solid var(--border-color);
        padding: 6px 12px;
        font-size: 0.75rem;
        font-weight: bold;
        border-radius: 4px;
        z-index: 2;
      }
      .source-node {
        top: 10px;
        left: 40px;
        border-color: var(--neon-cyan);
      }
      .destination-node {
        bottom: 10px;
        right: 40px;
        border-color: var(--neon-pink);
      }

      .source-node .node-glow {
        box-shadow: 0 0 10px var(--neon-cyan);
      }
      .destination-node .node-glow {
        box-shadow: 0 0 10px var(--neon-pink);
      }

      /* Pipe Cell Blueprint Element Engine */
      .pipe-cell {
        background: rgba(11, 17, 33, 0.8);
        border: 1px solid rgba(30, 44, 79, 0.6);
        border-radius: 8px;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition:
          transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
          background-color 0.2s;
      }

      .pipe-cell:hover {
        background: rgba(18, 27, 51, 0.9);
        border-color: rgba(0, 210, 255, 0.3);
      }

      /* Core SVG Vectors Pipeline Architecture Styling */
      .pipe-cell svg {
        width: 100%;
        height: 100%;
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .pipe-path {
        fill: none;
        stroke: var(--pipe-off);
        stroke-width: 12;
        stroke-linecap: round;
        transition: stroke 0.3s ease;
      }

      /* Dynamic Animated Water Flow Simulation Pipeline */
      .pipe-cell.filled .pipe-path {
        stroke: var(--pipe-on);
        filter: drop-shadow(0 0 6px var(--neon-blue));
        stroke-dasharray: 100;
        animation: flowDash 2s linear infinite;
      }

      /* Modifiers State Framework (Locked, Hidden, Bonus) */
      .pipe-cell.locked {
        cursor: not-allowed;
        background: rgba(255, 51, 51, 0.03);
        border-color: rgba(255, 51, 51, 0.2);
      }
      .lock-icon {
        position: absolute;
        top: 4px;
        right: 4px;
        font-size: 0.65rem;
        color: var(--neon-red);
        text-shadow: 0 0 4px var(--neon-red);
      }

      .bonus-item {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.1rem;
        animation: floating 1.5s ease-in-out infinite;
        z-index: 3;
      }

      .pipe-cell.hidden-section {
        filter: blur(8px);
        pointer-events: none;
      }
      .pipe-cell.hidden-section.revealed {
        filter: none;
        pointer-events: auto;
        animation: popEffect 0.3s ease-out forwards;
      }

      /* Overlays Glassmorphism Panel Setup */
      .grid-overlay {
        position: absolute;
        inset: 0;
        background: rgba(11, 17, 33, 0.96);
        backdrop-filter: blur(8px);
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 15px;
        z-index: 10;
        text-align: center;
        padding: 20px;
      }
      .grid-overlay.active {
        display: flex;
      }

      /* Control Buttons System UI Elements */
      .btn {
        padding: 12px 28px;
        background: transparent;
        border-radius: 6px;
        font-weight: bold;
        letter-spacing: 1px;
        cursor: pointer;
        font-size: 0.95rem;
        transition: all 0.2s ease;
      }
      .btn-neon {
        border: 2px solid var(--neon-blue);
        color: #fff;
        box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
      }
      .btn-neon:hover {
        background: var(--neon-blue);
        color: var(--bg-global);
        box-shadow: 0 0 20px var(--neon-blue);
      }
      .btn-neon-red {
        border: 2px solid var(--neon-red);
        color: #fff;
      }
      .btn-neon-red:hover {
        background: var(--neon-red);
        box-shadow: 0 0 20px var(--neon-red);
      }

      .dashboard-footer {
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .btn-util {
        background: var(--panel-bg);
        border: 1px solid var(--border-color);
        color: #fff;
        padding: 10px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.8rem;
        flex: 1;
      }
      .btn-util:hover {
        border-color: var(--neon-blue);
        color: var(--neon-blue);
      }
      .btn-danger:hover {
        border-color: var(--neon-red);
        color: var(--neon-red);
      }

      /* Typography Shadow System */
      .neon-text-blue {
        text-shadow: 0 0 8px var(--neon-blue);
        color: var(--neon-blue);
      }
      .neon-text-cyan {
        text-shadow: 0 0 8px var(--neon-cyan);
        color: var(--neon-cyan);
      }
      .neon-text-red {
        text-shadow: 0 0 8px var(--neon-red);
        color: var(--neon-red);
      }

      /* Core Animation Matrices keyframes */
      @keyframes flowDash {
        to {
          stroke-dashoffset: -100;
        }
      }
      @keyframes floating {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-4px);
        }
      }
      @keyframes popEffect {
        0% {
          transform: scale(0.8);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }
      .blink-anim {
        animation: blink 1.5s infinite;
      }
      .pop-anim {
        animation: popEffect 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)
          forwards;
      }

      /* Responsive Viewports Overrides rules */
      @media (max-width: 480px) {
        .grid-viewport {
          padding: 30px 10px;
        }
        .dashboard-footer {
          flex-wrap: wrap;
        }
        .btn-util {
          flex: calc(50% - 10px);
        }
        .btn-danger {
          flex: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="game-wrapper">
      <header class="dashboard-header">
        <div class="control-box">
          <span class="box-label">GRID LEVEL</span>
          <span id="level-display" class="box-value neon-text-blue">1</span>
        </div>
        <div class="control-box">
          <span class="box-label">NET SCORE</span>
          <span id="score-display" class="box-value neon-text-cyan">0000</span>
        </div>
        <div class="control-box">
          <span class="box-label">LIMIT MOVES</span>
          <span id="moves-display" class="box-value">30</span>
        </div>
        <div class="control-box">
          <span class="box-label">FLOW TIME</span>
          <span id="timer-display" class="box-value neon-text-red">45</span>
        </div>
      </header>

      <main class="grid-viewport">
        <div class="terminal-node source-node">
          <div class="node-glow"></div>
          <span>IN</span>
        </div>

        <div id="pipe-grid-container" class="pipe-grid"></div>

        <div class="terminal-node destination-node">
          <div class="node-glow"></div>
          <span>OUT</span>
        </div>

        <div id="win-overlay" class="grid-overlay">
          <h2 class="neon-text-cyan pop-anim">GRID STABILIZED</h2>
          <p>Flow trajectory confirmed. Pressure nominal.</p>
          <button id="next-level-btn" class="btn btn-neon">
            NEXT TERMINAL
          </button>
        </div>

        <div id="fail-overlay" class="grid-overlay">
          <h2 class="neon-text-red blink-anim">GRID PRESSURE FAILURE</h2>
          <p>Containment breached or operations limit reached.</p>
          <button id="retry-btn" class="btn btn-neon-red">REBOOT CORE</button>
        </div>
      </main>

      <footer class="dashboard-footer">
        <button id="hint-btn" class="btn-util">
          💡 CORE HINT (<span id="hint-display">3</span>)
        </button>
        <button id="restart-btn" class="btn-util">🔄 FLUSH GRID</button>
        <button id="wipe-progress-btn" class="btn-util btn-danger">
          RESET SYSTEM DATA
        </button>
      </footer>
    </div>
    <script>
      // --- Core Declarative Mapping Model configurations ---
      // Pipe structural vectors lookup dictionary mapping index sequence [North, East, South, West]
      const PIPE_CONFIGS = {
        straight: {
          id: "straight",
          paths: ["M 50 0 L 50 100"],
          connections: [true, false, true, false],
        },
        corner: {
          id: "corner",
          paths: ["M 50 100 Q 50 50 100 50"],
          connections: [false, true, true, false],
        },
        cross: {
          id: "cross",
          paths: ["M 50 0 L 50 100", "M 0 50 L 100 50"],
          connections: [true, true, true, true],
        },
        oneway: {
          id: "oneway",
          paths: ["M 50 100 L 50 20", "M 40 40 L 50 20 L 60 40"],
          connections: [true, false, true, false],
        }, // strictly flows up natively
        blocked: {
          id: "blocked",
          paths: ["M 50 35 L 50 65", "M 35 50 L 65 50"],
          connections: [false, false, false, false],
        },
      };

      // --- Pipe Node Unit Class Matrix Entity ---
      class PipeNode {
        constructor(
          type,
          isLocked = false,
          hasBonus = false,
          isHidden = false,
        ) {
          this.type = type;
          this.isLocked = isLocked;
          this.hasBonus = hasBonus;
          this.isHidden = isHidden;
          this.isRevealed = !isHidden;
          this.rotation = [0, 90, 180, 270][Math.floor(Math.random() * 4)]; // Scramble orientation initial block
          this.isFilled = false;
        }

        rotate() {
          if (this.isLocked) return false;
          this.rotation = (this.rotation + 90) % 360;
          return true;
        }

        // Dynamic directional connections shift computational evaluation matrix
        getConnections() {
          let base = [...PIPE_CONFIGS[this.type].connections];
          let shifts = (this.rotation / 90) % 4;
          for (let i = 0; i < shifts; i++) {
            let last = base.pop();
            base.unshift(last);
          }
          return base; // returns adjusted array matching active layout orientation [N, E, S, W]
        }
      }

      // --- Application Pipeline Controller Orchestrator Class Engine ---
      class HydroGridEngine {
        constructor() {
          this.gridContainer = document.getElementById("pipe-grid-container");
          this.level = 1;
          this.score = 0;
          this.movesRemaining = 30;
          this.timer = 45;
          this.hintsRemaining = 3;

          this.gridSize = 4; // Dynamic structural bounds mapping scaling metric variables
          this.matrix = [];
          this.timerInterval = null;
          this.isPlaying = false;

          this.initDOM();
          this.loadSystemCacheData();
          this.buildLevelProgressionContext();
        }

        initDOM() {
          document
            .getElementById("next-level-btn")
            .addEventListener("click", () => this.advanceLevelSequence());
          document
            .getElementById("retry-btn")
            .addEventListener("click", () =>
              this.buildLevelProgressionContext(),
            );
          document
            .getElementById("restart-btn")
            .addEventListener("click", () =>
              this.buildLevelProgressionContext(),
            );
          document
            .getElementById("hint-btn")
            .addEventListener("click", () => this.deployVisualHintNode());
          document
            .getElementById("wipe-progress-btn")
            .addEventListener("click", () => this.purgeSystemCacheData());
        }

        buildLevelProgressionContext() {
          this.isPlaying = true;
          this.gridSize = this.level >= 5 ? 6 : this.level >= 3 ? 5 : 4;
          this.movesRemaining = Math.max(12, 35 - this.level * 2);
          this.timer = Math.max(20, 60 - this.level * 3);

          document.getElementById("win-overlay").classList.remove("active");
          document.getElementById("fail-overlay").classList.remove("active");

          this.generateRandomMatrixPuzzle();
          this.renderViewportHTMLGrid();
          this.computeWaterFlowSimulation();
          this.resetTimerThread();
          this.syncDashboardDisplays();
          this.saveSystemCacheData();
        }

        generateRandomMatrixPuzzle() {
          this.matrix = [];
          const pool = ["straight", "corner", "cross", "oneway"];

          for (let r = 0; r < this.gridSize; r++) {
            let row = [];
            for (let c = 0; c < this.gridSize; c++) {
              let type = pool[Math.floor(Math.random() * pool.length)];

              // Algorithmic random contextual placements injection block
              let isLocked = Math.random() < 0.12 && !(r === 0 && c === 0);
              let hasBonus = Math.random() < 0.08;
              let isHidden =
                Math.random() < 0.1 &&
                !((r === 0 && c === 0) || r === this.gridSize - 1);

              // Ensure boundary paths contain connection units
              if (r === 0 && c === 0) type = "corner";
              if (r === this.gridSize - 1 && c === this.gridSize - 1)
                type = "straight";

              // Blocked node layout assignment
              if (Math.random() < 0.05 && r !== 0 && c !== 0) type = "blocked";

              row.push(new PipeNode(type, isLocked, hasBonus, isHidden));
            }
            this.matrix.push(row);
          }
        }

        renderViewportHTMLGrid() {
          this.gridContainer.innerHTML = "";
          this.gridContainer.style.gridTemplateColumns = `repeat(${this.gridSize}, 1fr)`;

          for (let r = 0; r < this.gridSize; r++) {
            for (let c = 0; c < this.gridSize; c++) {
              const node = this.matrix[r][c];
              const cell = document.createElement("div");
              cell.className = `pipe-cell ${node.isLocked ? "locked" : ""} ${node.isHidden ? "hidden-section" : ""}`;
              cell.setAttribute("data-row", r);
              cell.setAttribute("data-col", c);
              cell.style.transform = `rotate(${node.rotation}deg)`;

              // Dynamic SVG assembly vector pipelines injector block
              let svgHTML = `<svg viewBox="0 0 100 100">`;
              PIPE_CONFIGS[node.type].paths.forEach((p) => {
                svgHTML += `<path class="pipe-path" d="${p}" />`;
              });
              svgHTML += `</svg>`;
              cell.innerHTML = svgHTML;

              // Modifiers append loops
              if (node.isLocked)
                cell.innerHTML += `<div class="lock-icon">🔒</div>`;
              if (node.hasBonus)
                cell.innerHTML += `<div class="bonus-item">💎</div>`;

              cell.addEventListener("click", () =>
                this.handleCellRotation(r, c, cell),
              );
              this.gridContainer.appendChild(cell);
            }
          }
        }

        handleCellRotation(r, c, element) {
          if (!this.isPlaying) return;
          const node = this.matrix[r][c];

          if (node.rotate()) {
            this.movesRemaining--;
            element.style.transform = `rotate(${node.rotation}deg)`;

            // Contextual neighborhood reveal validation
            this.revealAdjacentHiddenSections(r, c);

            this.computeWaterFlowSimulation();
            this.syncDashboardDisplays();

            if (this.movesRemaining <= 0 && this.isPlaying) {
              this.triggerGameOverSequence(false);
            }
          }
        }

        revealAdjacentHiddenSections(r, c) {
          const targets = [
            [r - 1, c],
            [r + 1, c],
            [r, c - 1],
            [r, c + 1],
          ];
          targets.forEach(([tr, tc]) => {
            if (
              tr >= 0 &&
              tr < this.gridSize &&
              tc >= 0 &&
              tc < this.gridSize
            ) {
              let targetNode = this.matrix[tr][tc];
              if (targetNode.isHidden) {
                targetNode.isHidden = false;
                targetNode.isRevealed = true;
                let cellDOM = this.gridContainer.querySelector(
                  `[data-row="${tr}"][data-col="${tc}"]`,
                );
                if (cellDOM) cellDOM.classList.add("revealed");
              }
            }
          });
        }

        computeWaterFlowSimulation() {
          // Reset all nodes state
          for (let r = 0; r < this.gridSize; r++) {
            for (let c = 0; c < this.gridSize; c++) {
              this.matrix[r][c].isFilled = false;
            }
          }

          // Run recursive DFS parsing path tracking matrix pipelines
          this.parseFlowDFS(0, 0, null);

          // Commit state transformations out onto DOM node targets
          for (let r = 0; r < this.gridSize; r++) {
            for (let c = 0; c < this.gridSize; c++) {
              let cellDOM = this.gridContainer.querySelector(
                `[data-row="${r}"][data-col="${c}"]`,
              );
              if (cellDOM) {
                if (this.matrix[r][c].isFilled) {
                  cellDOM.classList.add("filled");
                  // Collect rewards metrics triggers
                  if (this.matrix[r][c].hasBonus) {
                    this.matrix[r][c].hasBonus = false;
                    this.score += 250;
                    let bDOM = cellDOM.querySelector(".bonus-item");
                    if (bDOM) bDOM.remove();
                  }
                } else {
                  cellDOM.classList.remove("filled");
                }
              }
            }
          }

          // Win Condition Pipeline check tracking exit parameters bounds mapping
          const endNode = this.matrix[this.gridSize - 1][this.gridSize - 1];
          if (endNode.isFilled && endNode.getConnections()[1]) {
            // Outflow via East mapping boundary rule
            this.triggerGameOverSequence(true);
          }
        }

        parseFlowDFS(r, c, incomingDirection) {
          if (r < 0 || r >= this.gridSize || c < 0 || c >= this.gridSize)
            return;
          const currentCell = this.matrix[r][c];

          if (currentCell.isFilled) return;

          let connections = currentCell.getConnections(); // [N, E, S, W]

          // Validate entry interface boundaries rule checks logic matching loop
          if (incomingDirection !== null) {
            if (incomingDirection === "NORTH" && !connections[0]) return;
            if (incomingDirection === "EAST" && !connections[1]) return;
            if (incomingDirection === "SOUTH" && !connections[2]) return;
            if (incomingDirection === "WEST" && !connections[3]) return;
          } else {
            // Entry point rule mapping condition constraint logic fallback
            if (!connections[3]) return; // Must open towards West entrance node edge
          }

          currentCell.isFilled = true;

          // Spread directional flow recursive signals output tracking
          if (connections[0]) this.parseFlowDFS(r - 1, c, "SOUTH");
          if (connections[1]) this.parseFlowDFS(r, c + 1, "WEST");
          if (connections[2]) this.parseFlowDFS(r + 1, c, "NORTH");
          if (connections[3]) this.parseFlowDFS(r, c - 1, "EAST");
        }

        deployVisualHintNode() {
          if (this.hintsRemaining <= 0 || !this.isPlaying) return;

          // Find first misplaced flow path cell node sequentially
          for (let r = 0; r < this.gridSize; r++) {
            for (let c = 0; c < this.gridSize; c++) {
              let n = this.matrix[r][c];
              if (!n.isFilled && !n.isLocked && n.type !== "blocked") {
                n.rotation = 0; // Align natively to theoretical grid axis
                let cellDOM = this.gridContainer.querySelector(
                  `[data-row="${r}"][data-col="${c}"]`,
                );
                if (cellDOM) cellDOM.style.transform = `rotate(0deg)`;
                this.hintsRemaining--;
                document.getElementById("hint-display").innerText =
                  this.hintsRemaining;
                this.computeWaterFlowSimulation();
                return;
              }
            }
          }
        }

        triggerGameOverSequence(isVictory) {
          this.isPlaying = false;
          clearInterval(this.timerInterval);

          if (isVictory) {
            this.score += this.movesRemaining * 50 + this.timer * 20;
            document.getElementById("win-overlay").classList.add("active");
          } else {
            document.getElementById("fail-overlay").classList.add("active");
          }
          this.saveSystemCacheData();
        }

        resetTimerThread() {
          clearInterval(this.timerInterval);
          this.timerInterval = setInterval(() => {
            if (this.isPlaying) {
              this.timer--;
              document.getElementById("timer-display").innerText = this.timer;
              if (this.timer <= 0) this.triggerGameOverSequence(false);
            }
          }, 1000);
        }

        syncDashboardDisplays() {
          document.getElementById("level-display").innerText = this.level;
          document.getElementById("score-display").innerText = this.score
            .toString()
            .padStart(4, "0");
          document.getElementById("moves-display").innerText =
            this.movesRemaining;
          document.getElementById("timer-display").innerText = this.timer;
        }

        advanceLevelSequence() {
          this.level++;
          this.buildLevelProgressionContext();
        }

        // --- Persistence Management Engine layer ---
        saveSystemCacheData() {
          localStorage.setItem(
            "hydro_grid_save",
            JSON.stringify({
              level: this.level,
              score: this.score,
            }),
          );
        }

        loadSystemCacheData() {
          let raw = localStorage.getItem("hydro_grid_save");
          if (raw) {
            let data = JSON.parse(raw);
            this.level = data.level || 1;
            this.score = data.score || 0;
          }
        }

        purgeSystemCacheData() {
          localStorage.removeItem("hydro_grid_save");
          this.level = 1;
          this.score = 0;
          this.hintsRemaining = 3;
          document.getElementById("hint-display").innerText = 3;
          this.buildLevelProgressionContext();
        }
      }

      // Global Thread Initialization Execution Engine Context Setup Interceptor
      document.addEventListener("DOMContentLoaded", () => {
        new HydroGridEngine();
      });
    </script>
  </body>
</html>
