<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق QR Code الذكي</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0B1121; /* الخلفية الأساسية المطلوبة */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .main-container {
            background-color: #131B2E;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border: 1px solid #1F2A45;
        }
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .tab-btn {
            background-color: #1F2A45;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .tab-btn.active {
            background-color: #4AE2DC; /* اللون المطلوب للتنشيط */
            color: #0B1121;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .input-group {
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        /* تحويل أزرار الاختيار لتبدو تماماً كالأزرار العلوية */
        .radio-switcher {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
        }
        .radio-switcher input[type="radio"] {
            display: none; /* إخفاء الدائرة الافتراضية للراديو */
        }
        .radio-switcher .btn-radio {
            background-color: #1F2A45;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            flex: 1;
            text-align: center;
        }
        .radio-switcher input[type="radio"]:checked + .btn-radio {
            background-color: #4AE2DC;
            color: #0B1121;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #1F2A45;
            border-radius: 6px;
            background-color: #0B1121;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
            transition: border 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #4AE2DC;
        }
        .btn {
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-generate {
            background-color: #4AE2DC;
            color: #0B1121;
            width: 100%;
        }
        .btn-generate:hover {
            background-color: #3bc4be;
        }
        .btn-download {
            background-color: #22c55e;
            color: white;
            display: none;
            width: 100%;
        }
        .btn-download:hover {
            background-color: #16a34a;
        }
        #qr-result-container {
            margin-top: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .canvas-container {
            background-color: white;
            padding: 15px;
            border-radius: 8px;
            display: inline-block;
        }
        canvas {
            display: block;
        }
        /* أنماط ماسح الكاميرا */
        #scanner-container {
            position: relative;
            width: 100%;
            height: 280px;
            margin: 0 auto;
            border: 2px solid #1F2A45;
            border-radius: 8px;
            overflow: hidden;
            display: none;
        }
        #scanner-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #scanner-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 180px;
            height: 180px;
            border: 4px solid #4AE2DC;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(74, 226, 220, 0.3);
            pointer-events: none;
        }
        #scanner-overlay::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: #4AE2DC;
            animation: scan-line 2s linear infinite;
        }
        @keyframes scan-line {
            0% { top: 0; }
            50% { top: 100%; }
            100% { top: 0; }
        }
        #scan-result {
            margin-top: 15px;
            background-color: #0B1121;
            padding: 15px;
            border-radius: 6px;
            word-wrap: break-word;
            display: none;
            border: 1px solid #1F2A45;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h2>منشئ ومحرر كود QR</h2>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('generate')">توليد كود QR</button>
            <button class="tab-btn" onclick="switchTab('scan')">مسح كود QR</button>
        </div>

        <div id="generate-tab" class="tab-content active">
            <div class="input-group">
                <label>نوع المحتوى:</label>
                <div class="radio-switcher">
                    <label>
                        <input type="radio" name="qr-type" value="text" checked onchange="updateInputFields()">
                        <div class="btn-radio">نص / رابط</div>
                    </label>
                    <label>
                        <input type="radio" name="qr-type" value="wifi" onchange="updateInputFields()">
                        <div class="btn-radio">Wi-Fi</div>
                    </label>
                </div>
            </div>

            <div id="dynamic-inputs" style="display: flex; flex-direction: column; gap: 12px;">
                <div id="input-text" class="input-group">
                    <input type="text" id="text-input" placeholder="أدخل الرابط أو النص العربي/الإنجليزي هنا...">
                </div>
                
                <div id="input-wifi" class="input-group" style="display: none; gap: 12px;">
                    <input type="text" id="wifi-ssid" placeholder="اسم الشبكة (SSID)">
                    <select id="wifi-type" onchange="toggleWifiPasswordVisibility()">
                        <option value="WPA">WPA/WPA2</option>
                        <option value="WEP">WEP</option>
                        <option value="nopass">بدون تشفير (Open)</option>
                    </select>
                    <input type="password" id="wifi-pass" placeholder="كلمة المرور">
                </div>
            </div>

            <button class="btn btn-generate" onclick="generateSmartQR()">تحويل إلى QR Code</button>

            <div id="qr-result-container">
                <div class="canvas-container">
                    <canvas id="qr-canvas"></canvas>
                </div>
                <button class="btn btn-download" id="download-btn" onclick="downloadCustomQR()">تحميل الصورة (PNG)</button>
            </div>
        </div>

        <div id="scan-tab" class="tab-content">
            <button class="btn btn-generate" id="start-scan-btn" onclick="startScanner()">تشغيل الكاميرا للفحص</button>
            <button class="btn btn-generate" id="stop-scan-btn" onclick="stopScanner()" style="display: none; background-color: #ef4444; color: white;">إيقاف الكاميرا</button>
            
            <div id="scanner-container">
                <video id="scanner-video"></video>
                <div id="scanner-overlay"></div>
            </div>

            <div id="scan-result">
                <strong>النتيجة:</strong>
                <p id="scan-result-text"></p>
            </div>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    
    <script>
        let qrInstance = null;
        const codeReader = new ZXing.BrowserQRCodeReader();
        let scannerControls = null;

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'generate') {
                document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
                document.getElementById('generate-tab').classList.add('active');
                stopScanner();
            } else {
                document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
                document.getElementById('scan-tab').classList.add('active');
            }
        }

        function updateInputFields() {
            const selectedType = document.querySelector('input[name="qr-type"]:checked').value;
            document.getElementById('input-text').style.display = 'none';
            document.getElementById('input-wifi').style.display = 'none';

            document.getElementById(`input-${selectedType}`).style.display = 'flex';
            
            if(selectedType === 'wifi') {
                toggleWifiPasswordVisibility();
            }
        }

        // دالة إخفاء وإظهار حقل كلمة المرور للواي فاي ذكياً
        function toggleWifiPasswordVisibility() {
            const wifiType = document.getElementById('wifi-type').value;
            const passInput = document.getElementById('wifi-pass');
            if (wifiType === 'nopass') {
                passInput.style.display = 'none';
                passInput.value = ''; // تصفية القيمة منعاً للمشاكل
            } else {
                passInput.style.display = 'block';
            }
        }

        function generateSmartQR() {
            const type = document.querySelector('input[name="qr-type"]:checked').value;
            const canvas = document.getElementById('qr-canvas');
            const downloadBtn = document.getElementById('download-btn');
            let qrText = "";

            if (type === 'text') {
                qrText = document.getElementById('text-input').value.trim();
            } else if (type === 'wifi') {
                const ssid = document.getElementById('wifi-ssid').value.trim();
                const pass = document.getElementById('wifi-pass').value.trim();
                const wifiType = document.getElementById('wifi-type').value;
                if (!ssid) { alert("اسم الشبكة مطلوب!"); return; }
                qrText = `WIFI:S:${ssid};T:${wifiType};P:${pass};;`;
            }

            if (!qrText) {
                alert("الرجاء إدخال البيانات أولاً!");
                return;
            }

            // --- حل مشكلة اللغة العربية الجذري ---
            // نقوم بتحويل النص السلس إلى سلسلة بايتات متوافقة مع ترميز UTF-8 القياسي
            const utf8CompatibleText = unescape(encodeURIComponent(qrText));

            if (!qrInstance) {
                qrInstance = new QRious({
                    element: canvas,
                    size: 220,
                    level: 'M'
                });
            }

            qrInstance.set({
                value: utf8CompatibleText,
                foreground: '#000000',
                background: '#ffffff'
            });

            downloadBtn.style.display = "block";
        }

        function downloadCustomQR() {
            const canvas = document.getElementById('qr-canvas');
            const imageURL = canvas.toDataURL("image/png");
            const downloadLink = document.createElement('a');
            downloadLink.href = imageURL;
            downloadLink.download = 'qrcode.png';
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }

        // --- وظائف ماسح الكاميرا المحلية ---
        async function startScanner() {
            const videoElem = document.getElementById('scanner-video');
            const containerElem = document.getElementById('scanner-container');
            const startBtn = document.getElementById('start-scan-btn');
            const stopBtn = document.getElementById('stop-scan-btn');
            const resultElem = document.getElementById('scan-result');
            const resultText = document.getElementById('scan-result-text');

            try {
                containerElem.style.display = 'block';
                startBtn.style.display = 'none';
                stopBtn.style.display = 'block';
                resultElem.style.display = 'none';

                scannerControls = await codeReader.decodeFromVideoDevice(null, videoElem, (result, error) => {
                    if (result) {
                        resultElem.style.display = 'block';
                        resultText.innerText = result.text;
                        stopScanner();
                    }
                });
            } catch (err) {
                console.error(err);
                alert("تعذر الوصول إلى الكاميرا. تحقق من الصلاحيات محلياً.");
                stopScanner();
            }
        }

        function stopScanner() {
            if (scannerControls) {
                scannerControls.stop();
                scannerControls = null;
            }
            document.getElementById('scanner-container').style.display = 'none';
            document.getElementById('start-scan-btn').style.display = 'block';
            document.getElementById('stop-scan-btn').style.display = 'none';
        }
    </script>
</body>
</html>
