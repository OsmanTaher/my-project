<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Formatter & Validator</title>
    <style>
        /* المتغيرات والألوان (ثيم داكن احترافي للمبرمجين) */
        :root {
            --bg-main: #0B1121;
            --bg-editor: #131B2E;
            --accent: #4AE2DC;
            --accent-hover: #3cd0ca;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --error-color: #EF4444;
            --success-color: #10B981;
            --border: #1E293B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        /* حاوية الأداة الرئيسية */
        .wrapper {
            width: 100%;
            max-width: 900px;
            animation: fadeIn 0.4s ease-out;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* شريط الأدوات (الأزرار) */
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--bg-editor);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background-color: var(--accent);
            color: var(--bg-main);
            border: none;
            font-weight: 600;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            color: var(--bg-main);
            box-shadow: 0 0 15px rgba(74, 226, 220, 0.2);
        }

        /* منطقة المحرر */
        .editor-container {
            position: relative;
            background-color: var(--bg-editor);
            border-radius: 8px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: border-color 0.2s ease;
        }

        .editor-container:focus-within {
            border-color: rgba(74, 226, 220, 0.4);
        }

        /* تخصيص الـ Textarea للكود (إجباري LTR للـ JSON) */
        textarea {
            width: 100%;
            height: 450px;
            background: transparent;
            border: none;
            outline: none;
            color: #E2E8F0;
            padding: 1.2rem;
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            line-height: 1.5;
            resize: vertical;
            direction: ltr;
            text-align: left;
        }

        /* شريط الحالة والرسائل */
        .status-bar {
            margin-top: 1rem;
            padding: 0.8rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            display: none;
            animation: slideDown 0.2s ease-out;
            direction: ltr;
            text-align: left;
        }

        .status-bar.error {
            display: block;
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error-color);
            color: var(--error-color);
        }

        .status-bar.success {
            display: block;
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success-color);
            color: var(--success-color);
            direction: rtl;
            text-align: right;
        }

        /* تأثيرات الحركة */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <header>
            <h1>JSON Formatter & Validator</h1>
            <p>أداة سريعة لتنسيق، فحص، وضغط نصوص JSON في بيئة محلية آمنة.</p>
        </header>

        <div class="toolbar">
            <button class="btn btn-primary" id="btn-format">تنسيق (Format)</button>
            <button class="btn" id="btn-minify">تنظيف (Minify)</button>
            <button class="btn" id="btn-copy">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                نسخ الكود
            </button>
        </div>

        <div class="editor-container">
            <textarea id="json-input" placeholder="// قم بلصق أو كتابة كود JSON هنا..."></textarea>
        </div>

        <div id="status-output" class="status-bar"></div>
    </div>

    <script>
        const jsonInput = document.getElementById('json-input');
        const btnFormat = document.getElementById('btn-format');
        const btnMinify = document.getElementById('btn-minify');
        const btnCopy = document.getElementById('btn-copy');
        const statusOutput = document.getElementById('status-output');

        // دالة مساعدة لإظهار الحالات (نجاح / خطأ)
        function showStatus(message, type) {
            statusOutput.textContent = message;
            statusOutput.className = `status-bar ${type}`;
        }

        function clearStatus() {
            statusOutput.textContent = '';
            statusOutput.className = 'status-bar';
        }

        // منطق زر التنسيق (Format)
        btnFormat.addEventListener('click', () => {
            const rawValue = jsonInput.value.trim();
            if (!rawValue) return;

            try {
                // 1. تحويل النص إلى كائن برمجى للتحقق من صحته
                const parsedJson = JSON.parse(rawValue);
                
                // 2. إعادة تحويل الكائن إلى نص منسق بـ 4 مسافات بادئة
                jsonInput.value = JSON.stringify(parsedJson, null, 4);
                
                showStatus('تم تنسيق الكود والتحقق من سلامته بنجاح.', 'success');
            } catch (error) {
                // في حال الفشل يتم إمساك الخطأ وعرض رسالته ومكانه
                showStatus(`خطأ في الهيكل: ${error.message}`, 'error');
            }
        });

        // منطق زر الضغط والتنظيف (Minify)
        btnMinify.addEventListener('click', () => {
            const rawValue = jsonInput.value.trim();
            if (!rawValue) return;

            try {
                const parsedJson = JSON.parse(rawValue);
                // تحويل الكائن إلى سطر واحد بدون مسافات
                jsonInput.value = JSON.stringify(parsedJson);
                showStatus('تم ضغط الكود بنجاح.', 'success');
            } catch (error) {
                showStatus(`خطأ في الهيكل: ${error.message}`, 'error');
            }
        });

        // منطق نسخ الكود إلى الذاكرة المؤقتة (Copy to Clipboard)
        btnCopy.addEventListener('click', () => {
            const codeToCopy = jsonInput.value;
            if (!codeToCopy) return;

            navigator.clipboard.writeText(codeToCopy)
                .then(() => {
                    const originalText = btnCopy.innerHTML;
                    btnCopy.innerHTML = 'تم النسخ!';
                    btnCopy.style.color = 'var(--accent)';
                    
                    setTimeout(() => {
                        btnCopy.innerHTML = originalText;
                        btnCopy.style.color = '';
                    }, 2000);
                })
                .catch(err => {
                    showStatus('فشل نسخ الكود، يرجى المحاولة يدوياً.', 'error');
                });
        });

        // تنظيف شريط الحالة عند البدء في الكتابة من جديد
        jsonInput.addEventListener('input', clearStatus);
    </script>
</body>
</html>
