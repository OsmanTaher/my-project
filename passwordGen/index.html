<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مولد كلمات المرور الآمنة</title>
    <style>
      /* تعريف الألوان والمتغيرات */
      :root {
        --bg-main: #0b1121;
        --bg-card: #131b2e;
        --accent: #4ae2dc;
        --accent-hover: #3cd0ca;
        --text-white: #ffffff;
        --text-muted: #94a3b8;
        --border-color: #1e293b;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background-color: var(--bg-main);
        color: var(--text-white);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
      }

      /* أنيميشن دخول الكارد عند الفتح */
      @keyframes cardEntry {
        0% {
          opacity: 0;
          transform: translateY(30px) scale(0.95);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* حاوية المشروع الرئيسية */
      .container {
        background-color: var(--bg-card);
        padding: 2.5rem;
        border-radius: 16px;
        width: 100%;
        max-width: 450px;
        box-shadow:
          0 20px 40px rgba(0, 0, 0, 0.4),
          0 0 50px rgba(74, 226, 220, 0.05);
        border: 1px solid var(--border-color);
        animation: cardEntry 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        position: relative;
      }

      h2 {
        font-size: 1.5rem;
        margin-bottom: 1.5rem;
        text-align: center;
        color: var(--text-white);
        font-weight: 600;
      }

      /* شاشة عرض كلمة المرور */
      .result-container {
        background-color: var(--bg-main);
        padding: 1rem 1.2rem;
        border-radius: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
        border: 1px solid var(--border-color);
        transition: border-color 0.3s;
      }

      .result-container:hover {
        border-color: rgba(74, 226, 220, 0.3);
      }

      #password-display {
        font-family: "Courier New", Courier, monospace;
        font-size: 1.2rem;
        color: var(--accent);
        letter-spacing: 1px;
        white-space: nowrap;
        overflow-x: auto;
        width: 85%;
        scrollbar-width: none; /* لإخفاء السكرول في فايرفوكس */
      }

      #password-display::-webkit-scrollbar {
        display: none; /* لإخفاء السكرول في كروم وإيدج */
      }

      #password-display:empty::before {
        content: "انقر على إنشاء..";
        color: var(--text-muted);
        font-family: "Segoe UI", sans-serif;
        font-size: 1rem;
      }

      /* زر النسخ والتأثيرات الخاصة به */
      .copy-btn {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-muted);
        transition:
          color 0.2s,
          transform 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .copy-btn:hover {
        color: var(--accent);
        transform: scale(1.15);
      }

      .copy-btn:active {
        transform: scale(0.95);
      }

      /* التحكم في الطول */
      .length-container {
        margin-bottom: 1.5rem;
      }

      .length-labels {
        display: flex;
        justify-content: space-between;
        margin-bottom: 0.5rem;
        color: var(--text-muted);
        font-size: 0.9rem;
      }

      #length-val {
        color: var(--accent);
        font-weight: bold;
      }

      /* تخصيص الـ Slider */
      input[type="range"] {
        -webkit-appearance: none;
        width: 100%;
        height: 6px;
        background: var(--bg-main);
        border-radius: 5px;
        outline: none;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 5px;
        background: var(--accent);
        cursor: pointer;
        transition:
          transform 0.1s,
          background-color 0.2s;
      }

      input[type="range"]::-webkit-slider-thumb:hover {
        transform: scale(1.2);
        background: var(--accent-hover);
      }

      /* خيارات التحديد (Checkboxes) */
      .options-container {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 2rem;
      }

      .option-item {
        display: flex;
        align-items: center;
        cursor: pointer;
        user-select: none;
        color: var(--text-muted);
        transition: color 0.2s;
      }

      .option-item:hover {
        color: var(--text-white);
      }

      .option-item input[type="checkbox"] {
        display: none; /* إخفاء التشيك بوكس الافتراضي لتخصيصه */
      }

      /* صناعة تشيك بوكس مخصص متناسق مع التصميم */
      .custom-checkbox {
        width: 20px;
        height: 20px;
        border: 2px solid var(--border-color);
        border-radius: 6px;
        margin-left: 12px;
        display: inline-block;
        position: relative;
        transition: all 0.2s;
        background: var(--bg-main);
      }

      .option-item input[type="checkbox"]:checked + .custom-checkbox {
        background: var(--accent);
        border-color: var(--accent);
      }

      .option-item input[type="checkbox"]:checked + .custom-checkbox::after {
        content: "";
        position: absolute;
        left: 6px;
        top: 2px;
        width: 5px;
        height: 10px;
        border: solid var(--bg-main);
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
      }

      /* زر الإنشاء الرئيسي */
      .generate-btn {
        width: 100%;
        background-color: var(--accent);
        color: var(--bg-main);
        border: none;
        padding: 1rem;
        border-radius: 10px;
        font-size: 1.05rem;
        font-weight: bold;
        cursor: pointer;
        transition:
          background-color 0.2s,
          transform 0.2s,
          box-shadow 0.2s;
      }

      .generate-btn:hover {
        background-color: var(--accent-hover);
        box-shadow: 0 0 20px rgba(74, 226, 220, 0.3);
        transform: translateY(-2px);
      }

      .generate-btn:active {
        transform: translateY(0);
      }

      /* رسالة تأكيد النسخ (Toast) */
      .toast {
        position: absolute;
        bottom: -50px;
        left: 50%;
        transform: translateX(-50%);
        background-color: var(--accent);
        color: var(--bg-main);
        padding: 0.6rem 1.5rem;
        border-radius: 30px;
        font-size: 0.9rem;
        font-weight: 600;
        opacity: 0;
        transition:
          opacity 0.3s,
          bottom 0.3s;
        pointer-events: none;
        box-shadow: 0 10px 20px rgba(74, 226, 220, 0.2);
      }

      .toast.show {
        opacity: 1;
        bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>مُولد كلمات المرور الآمنة</h2>

      <div class="result-container">
        <div id="password-display"></div>
        <button class="copy-btn" id="copy-button" title="نسخ كلمة المرور">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path
              d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
            ></path>
          </svg>
        </button>
      </div>

      <div class="length-container">
        <div class="length-labels">
          <span>طول كلمة المرور:</span>
          <span id="length-val">12</span>
        </div>
        <input type="range" id="length-slider" min="6" max="30" value="12" />
      </div>

      <div class="options-container">
        <label class="option-item">
          <input type="checkbox" id="uppercase" checked />
          <span class="custom-checkbox"></span>
          حروف كبيرة (A-Z)
        </label>

        <label class="option-item">
          <input type="checkbox" id="lowercase" checked />
          <span class="custom-checkbox"></span>
          حروف صغيرة (a-z)
        </label>

        <label class="option-item">
          <input type="checkbox" id="numbers" checked />
          <span class="custom-checkbox"></span>
          أرقام (0-9)
        </label>

        <label class="option-item">
          <input type="checkbox" id="symbols" />
          <span class="custom-checkbox"></span>
          رموز خاصة (!@#$)
        </label>
      </div>

      <button class="generate-btn" id="generate-button">
        إنشاء كلمة مرور آمنة
      </button>

      <div class="toast" id="toast-message">تم النسخ بنجاح!</div>
    </div>

    <script>
      // جلب عناصر الواجهة
      const passwordDisplay = document.getElementById("password-display");
      const copyButton = document.getElementById("copy-button");
      const lengthSlider = document.getElementById("length-slider");
      const lengthVal = document.getElementById("length-val");
      const uppercaseCheck = document.getElementById("uppercase");
      const lowercaseCheck = document.getElementById("lowercase");
      const numbersCheck = document.getElementById("numbers");
      const symbolsCheck = document.getElementById("symbols");
      const generateButton = document.getElementById("generate-button");
      const toastMessage = document.getElementById("toast-message");

      // مجموعات الحروف والرموز
      const uppercaseChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const lowercaseChars = "abcdefghijklmnopqrstuvwxyz";
      const numbersChars = "0123456789";
      const symbolChars = "!@#$%^&*()_+~`|}{[]:;?><,./-=";

      // تحديث قيمة الرقم المصاحب للـ Slider ديناميكياً
      lengthSlider.addEventListener("input", (e) => {
        lengthVal.textContent = e.target.value;
      });

      // دالة توليد كلمة المرور العشوائية الصعبة
      function generatePassword() {
        let characterPool = "";
        let guaranteedCharacters = [];

        // بناء الـ Pool بناءً على خيارات المستخدم وضمان شمولية المجموعات المختارة
        if (uppercaseCheck.checked) {
          characterPool += uppercaseChars;
          guaranteedCharacters.push(
            uppercaseChars[Math.floor(Math.random() * uppercaseChars.length)],
          );
        }
        if (lowercaseCheck.checked) {
          characterPool += lowercaseChars;
          guaranteedCharacters.push(
            lowercaseChars[Math.floor(Math.random() * lowercaseChars.length)],
          );
        }
        if (numbersCheck.checked) {
          characterPool += numbersChars;
          guaranteedCharacters.push(
            numbersChars[Math.floor(Math.random() * numbersChars.length)],
          );
        }
        if (symbolsCheck.checked) {
          characterPool += symbolChars;
          guaranteedCharacters.push(
            symbolChars[Math.floor(Math.random() * symbolChars.length)],
          );
        }

        // التحقق من أن المستخدم اختار خيار واحد على الأقل
        if (characterPool === "") {
          alert("الرجاء اختيار نوع واحد على الأقل من الحروف أو الرموز!");
          return "";
        }

        const passwordLength = parseInt(lengthSlider.value);
        let generatedPassword = [...guaranteedCharacters];

        // ملء بقية الطول المطلوب عشوائياً
        for (let i = generatedPassword.length; i < passwordLength; i++) {
          const randomIndex = Math.floor(Math.random() * characterPool.length);
          generatedPassword.push(characterPool[randomIndex]);
        }

        // عمل خلط (Shuffle) لضمان عدم ترتيب الحروف المضمونة في البداية دائماً
        generatedPassword = generatedPassword.sort(() => Math.random() - 0.5);

        return generatedPassword.join("");
      }

      // حدث الضغط على زر الإنشاء
      generateButton.addEventListener("click", () => {
        const password = generatePassword();
        if (password) {
          passwordDisplay.textContent = password;
        }
      });

      // حدث الضغط على زر النسخ
      copyButton.addEventListener("click", () => {
        const password = passwordDisplay.textContent;

        if (!password) return; // إذا كانت الخانة فارغة لا تفعل شيء

        // نسخ النص للحافظة
        navigator.clipboard
          .writeText(password)
          .then(() => {
            // إظهار رسالة التنبيه (Toast)
            toastMessage.classList.add("show");

            // إخفائها بعد ثانيتين
            setTimeout(() => {
              toastMessage.classList.remove("show");
            }, 2000);
          })
          .catch((err) => {
            console.error("فشل النسخ: ", err);
          });
      });
    </script>
  </body>
</html>
